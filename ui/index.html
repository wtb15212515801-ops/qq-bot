<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ BOT</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --line:#e3e6ec;
    --text:#1f2430; --muted:#6f7787; --accent:#16a34a; --danger:#dc2626; --warn:#d97706;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    background: linear-gradient(180deg,#fbfcfd 0%, #f3f5f8 100%);
    color: var(--text);
    font: 14px/1.6 "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  #banner {
    display:none; position:fixed; left:0; right:0; top:0; z-index:200;
    padding:8px 14px; text-align:center; font-size:13px;
    background:#fdecec; color:#b91c1c; border-bottom:1px solid #f6d8d8;
  }
  #banner.on { display:block; }
  .app { display:flex; flex-direction:column; height:100vh; position:relative; }

  header {
    position:relative; z-index:100;
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    border-bottom:1px solid var(--line); background:rgba(255,255,255,.88); backdrop-filter:blur(10px);
  }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:.2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(22,163,74,.15); }
  .pills { display:flex; gap:6px; }
  .pill {
    display:flex; align-items:center; gap:5px; padding:2px 7px; border-radius:999px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted); font-size:11px; white-space:nowrap;
  }
  .pill i { width:6px; height:6px; border-radius:50%; background:#c3c8d2; }
  .pill.ok i { background:var(--accent); }
  .pill.warn i { background:var(--warn); }
  .pill.bad i { background:var(--danger); }
  .pill.ok { color:#15803d; background:#eef8f1; border-color:#d3ebdc; }
  .pill.bad { color:var(--muted); background:var(--panel-2); border-color:var(--line); }
  .spacer { flex:1 1 auto; }
  header > * { flex-shrink:0; }

  button.run { min-width:80px; }
  button.stop { background:#fff1f1; border-color:#f0c7c7; color:#b91c1c; }
  button.stop:hover { background:#ffe6e6; border-color:#e9b4b4; }
  .menu-wrap { position:relative; display:flex; }
  button.icon { width:32px; height:32px; padding:0; font-size:17px; line-height:1; border-radius:9px; color:var(--muted); }
  button.more { height:32px; padding:0 10px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  button.more:hover { color:var(--text); }
  button.more[aria-expanded="true"] { background:var(--panel-2); color:var(--text); }
  .caret { font-size:10px; opacity:.75; }
  .menu {
    position:absolute; right:0; top:38px; z-index:80; width:198px; padding:6px;
    display:flex; flex-direction:column; gap:2px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 34px rgba(17,24,39,.16);
  }
  .menu[hidden] { display:none; }
  .menu-row { text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:8px; font-size:13px; }
  .menu-row:hover { background:var(--panel-2); border-color:transparent; transform:none; }
  .menu-sep { height:1px; margin:5px 6px; background:var(--line); }
  .menu-label { padding:6px 10px 2px; font-size:11px; color:var(--muted); }
  .menu-levels { padding:2px 8px 6px; }
  .menu-levels select { width:100%; }
  @media (max-width: 940px) {
    .pill span { display:none; }
    .pill { padding:4px 6px; }
  }

  button {
    font:inherit; font-size:13px; color:var(--text); background:var(--panel);
    border:1px solid #dfe3ea; padding:6px 9px; border-radius:9px; cursor:pointer;
    transition:background .15s ease, transform .15s ease, border-color .15s ease; white-space:nowrap;
  }
  button:hover { background:#f5f7fa; border-color:#cfd5df; transform:translateY(-1px); }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  button.primary { background:linear-gradient(180deg,#22b06a,#189059); border-color:#189059; color:#fff; }
  button.primary:hover { background:linear-gradient(180deg,#25bd71,#1a9c60); }
  input[type=search], input[type=text] {
    font:inherit; font-size:13px; color:var(--text); background:var(--panel);
    border:1px solid #dfe3ea; border-radius:9px; padding:6px 10px; outline:none;
  }
  input:focus { border-color:#9dc9ae; box-shadow:0 0 0 3px rgba(22,163,74,.10); }
  select {
    font:inherit; font-size:13px; color:var(--text); background:var(--panel);
    border:1px solid #dfe3ea; border-radius:9px; padding:6px 8px; cursor:pointer; outline:none;
  }
  select:hover { background:#f5f7fa; }
  select option { background:#fff; color:var(--text); }

  main { flex:1; display:flex; min-height:0; }
  aside {
    width:236px; flex-shrink:0; border-right:1px solid var(--line);
    background:#fafbfc; overflow-y:auto; padding:10px;
  }
  .qrbox { display:none; margin-bottom:12px; padding:12px; border-radius:14px; background:#fff; border:1px solid var(--line); text-align:center; }
  .qrbox .cap { font-size:12px; color:#475569; margin-bottom:8px; }
  .qrbox img { width:100%; max-width:186px; display:block; margin:0 auto; }

  .chat {
    display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:11px;
    cursor:pointer; color:var(--muted); margin-bottom:3px; transition:background .15s ease;
  }
  .chat:hover { background:#f1f3f6; color:var(--text); }
  .chat.active { background:#eef7f1; color:var(--text); box-shadow:inset 2px 0 0 var(--accent); }
  .avatar {
    width:28px; height:28px; border-radius:8px; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-size:12px; font-weight:600;
    background:linear-gradient(135deg,#eef1f5,#e2e7ef); color:#5f6b7d; border:1px solid var(--line);
  }
  .chat.active .avatar { background:linear-gradient(135deg,#22b06a,#189059); color:#fff; border-color:#189059; }
  .chat .meta { flex:1; min-width:0; }
  .chat .name { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#4b5563; }
  .chat.has-unread .name { color:var(--text); font-weight:600; }
  .chat .sub { font-size:11px; color:#8a93a2; }
  .chat.has-unread .sub { color:#6f7787; }

  section.chatview { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }

  .stream {
    flex:1; overflow-y:auto; padding:12px 16px; background:#fff;
    font-family:"Cascadia Mono","Consolas","Microsoft YaHei UI",monospace;
    font-size:13px; line-height:1.85;
  }
  .line { display:flex; gap:8px; white-space:pre-wrap; word-break:break-word; }
  .line .t { color:#9aa3b1; flex-shrink:0; }
  .line .arrow { color:#c3c9d4; flex-shrink:0; }
  .line .who { flex-shrink:0; }
  .line .txt { flex:1; min-width:0; }
  .line.in .who { color:#5b6678; }
  .line.in .txt { color:#232835; }
  .line.out .who { color:var(--accent); }
  .line.out .txt { color:#146b3a; }
  .line.sys { color:#9aa3b1; font-style:italic; }
  .line.sys .who { color:#9aa3b1; }
  .line.hit { background:rgba(22,163,74,.10); border-radius:4px; }
  .line.hide { display:none; }

  .empty { margin:60px auto; color:var(--muted); text-align:center; font-size:13px; }
  .empty b { display:block; font-size:15px; color:var(--text); margin-bottom:6px; font-weight:600; }
  .empty .guideList { display:inline-block; text-align:left; margin:6px 0 10px; }
  .empty .guideList div { padding:2px 0; }
  .empty .guideList div.ok { color:var(--accent); }
  .empty .linkbtn { background:none; border:none; padding:2px 0; color:var(--accent); font:inherit; cursor:pointer; }
  .empty .linkbtn:hover { text-decoration:underline; }
  .guideSteps { margin:0; padding-left:20px; }
  .guideSteps li { margin-bottom:12px; }
  .guideSteps li b { display:block; margin-bottom:2px; font-size:13px; }
  .guideSteps li p { margin:0; color:var(--muted); font-size:12.5px; line-height:1.6; }

  #jump {
    position:absolute; right:26px; bottom:18px; display:none; z-index:5;
    box-shadow:0 6px 20px rgba(15,23,42,.14);
  }

  footer {
    display:flex; align-items:center; gap:10px; padding:8px 16px;
    border-top:1px solid var(--line); background:rgba(255,255,255,.88); font-size:12px; color:var(--muted);
  }
  footer .grow { flex:1; }

  .composer {
    display:flex; align-items:center; gap:8px; padding:9px 16px;
    border-top:1px solid var(--line); background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
  }
  .composer input { flex:1; }
  .composer button { padding:6px 16px; }

  /* 记忆面板 */
  #mempane {
    position:absolute; top:0; right:0; bottom:0; width:360px; z-index:120;
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .25s ease; overflow-y:auto;
    box-shadow:-14px 0 40px rgba(15,23,42,.10);
  }
  #mempane.open { transform:translateX(0); }
  #mempane .head {
    display:flex; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line);
    font-weight:600; position:sticky; top:0; background:var(--panel);
  }
  #mempane .body { padding:16px; font-size:13px; }
  #mempane h4 { margin:16px 0 8px; font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.5px; }
  #mempane h4:first-child { margin-top:0; }
  #mempane .facts { margin:0; padding-left:18px; }
  #mempane .facts li { margin-bottom:6px; color:#3c4553; }
  #mempane .summary { color:#3c4553; line-height:1.8; }
  .moodbar { height:8px; border-radius:4px; background:#e8ebf0; overflow:hidden; margin-top:6px; }
  .moodbar span { display:block; height:100%; background:linear-gradient(90deg,#f87171,#fbbf24,#22b06a); transition:width .3s ease; }

  /* ---------------- 多级窗口 ---------------- */
  .mask {
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:rgba(15,23,42,.35); backdrop-filter:blur(2px); animation:fade .15s ease;
  }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  .dialog {
    width:min(720px, 92vw); max-height:86vh; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 24px 60px rgba(15,23,42,.25); overflow:hidden;
  }
  .dialog header {
    display:flex; align-items:center; gap:10px; padding:14px 18px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .dialog header b { font-size:15px; }
  .dialog .body { padding:18px; overflow-y:auto; font-size:13px; line-height:1.75; }
  .dialog .foot { padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; }
  .dialog .x { margin-left:auto; }

  .tabs { display:flex; gap:6px; margin-bottom:16px; }
  .tabs button { border-radius:999px; padding:5px 12px; }
  .tabs button.on { background:#eef7f1; border-color:#bfe3cd; color:#15803d; font-weight:600; }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .seg { display:flex; gap:6px; }
  .seg button { padding:5px 12px; font-size:12px; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .checks { display:flex; flex-wrap:wrap; gap:10px 16px; font-size:13px; }
  .checks label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .exrow { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .exrow input { width:100%; }
  details > summary { cursor:pointer; font-size:12px; color:var(--muted); margin:16px 0 8px; }
  .field input[type=text], .field textarea {
    width:100%; font:inherit; font-size:13px; color:var(--text); background:#fff;
    border:1px solid #dfe3ea; border-radius:9px; padding:8px 10px; outline:none;
  }
  .field textarea { min-height:180px; resize:vertical; line-height:1.7; font-family:"Cascadia Mono","Consolas",monospace; }
  .field input:focus, .field textarea:focus { border-color:#9dc9ae; box-shadow:0 0 0 3px rgba(22,163,74,.10); }
  .hintline { font-size:12px; color:var(--muted); }

  .factlist { list-style:none; margin:0; padding:0; }
  .factlist li {
    display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-radius:9px;
    border:1px solid var(--line); margin-bottom:6px; background:#fff;
  }
  .factlist li span { flex:1; }
  .factlist li button { padding:2px 8px; font-size:12px; }
  .factlist .factmeta { flex:none; color:var(--muted); font-size:11px; padding-top:2px; }
  .chk { display:flex; align-items:flex-start; gap:8px; padding:5px 0; cursor:pointer; font-size:13px; }
  .chk input { margin-top:3px; }
  .chk .muted, .muted { color:var(--muted); font-size:12px; }
  .promptbox {
    margin:6px 0 0; padding:10px 12px; max-height:260px; overflow:auto;
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    font:12px/1.6 "Cascadia Mono","Consolas",monospace; white-space:pre-wrap; word-break:break-word;
  }

  .swatches { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .swatch {
    width:64px; height:44px; border-radius:10px; border:1px solid var(--line); cursor:pointer;
    display:flex; align-items:flex-end; justify-content:center; font-size:11px; padding-bottom:3px;
  }
  .swatch.on { outline:2px solid var(--accent); outline-offset:2px; }

  .chart { width:100%; height:200px; }
  .chart .bar-recv { fill:#bfe3cd; }
  .chart .bar-repl { fill:#22b06a; }
  .chart .axis { stroke:#e3e6ec; }
  .chart text { font-size:10px; fill:#8a93a2; }

  .kv { display:grid; grid-template-columns:96px 1fr; gap:6px 12px; }
  .kv div:nth-child(odd) { color:var(--muted); }

  ::-webkit-scrollbar { width:10px; }
  ::-webkit-scrollbar-thumb { background:#cdd3dc; border-radius:6px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:#b7bfca; background-clip:padding-box; border:2px solid transparent; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
<style id="themeVars"></style>
</head>
<body>
<div id="banner">与本地服务断开，正在重试…（关掉这个窗口再打开会重新连接）</div>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span>QQ BOT</div>
    <div class="pills">
      <div class="pill" id="p-napcat" title="NapCat 是否在线"><i></i><span>NapCat</span></div>
      <div class="pill" id="p-account" title="QQ 账号状态"><i></i><span>账号</span></div>
      <div class="pill" id="p-bot" title="机器人是否在跑"><i></i><span>机器人</span></div>
    </div>
    <div class="spacer"></div>
    <button id="btn-start" class="primary run">启动</button>
    <button id="btn-stop" class="run stop" hidden>停止</button>
    <div class="menu-wrap">
      <button id="btn-more" class="more" aria-label="更多" aria-expanded="false" title="更多功能">更多 <span class="caret">▾</span></button>
      <div id="moremenu" class="menu" hidden>
        <button id="btn-design" class="menu-row">设计</button>
        <button id="btn-mem" class="menu-row">记忆</button>
        <button id="btn-stats" class="menu-row">统计</button>
        <button id="btn-clear" class="menu-row">清理…</button>
        <button id="btn-about" class="menu-row">关于</button>
        <div class="menu-sep"></div>
        <div class="menu-label">回应频度</div>
        <div class="menu-levels">
          <select id="level">
            <option value="quiet">冷淡</option>
            <option value="normal">正常</option>
            <option value="active">活跃</option>
            <option value="chatty">话痨</option>
          </select>
        </div>
        <div class="menu-sep"></div>
        <button id="btn-restart" class="menu-row">重启 NapCat</button>
      </div>
    </div>
  </header>

  <main>
    <aside>
      <div class="qrbox" id="qrbox">
        <div class="cap">手机 QQ 扫码登录</div>
        <img id="qrimg" alt="二维码">
      </div>
      <input type="search" id="q" placeholder="搜索当前会话…" style="width:100%;margin-bottom:10px">
      <div id="chats"></div>
    </aside>

    <section class="chatview">
      <div class="stream" id="stream">
        <div id="list"></div>
        <div class="empty" id="empty"><b>还没有消息</b>启动机器人后，聊天会实时出现在这里</div>
      </div>
      <button id="jump">↓ 回到最新</button>
    </section>
  </main>

  <div class="composer">
    <input id="sendbox" type="text" maxlength="500" placeholder="以机器人的身份发一句（Enter 发送）">
    <button id="btn-send" class="primary">发送</button>
  </div>

  <footer>
    <span id="hint">就绪</span>
    <span class="grow"></span>
    <span id="found"></span>
    <span id="count"></span>
  </footer>

  <div id="modals"></div>

  <div id="mempane">
    <div class="head">
      <span>记忆</span>
      <span class="spacer"></span>
      <button id="btn-mem-close">关闭</button>
    </div>
    <div class="body" id="membody"></div>
  </div>
</div>

<script>
const S = { chats: [], active: "all", seq: 0, sig: "", gen: -1, q: "", napcat: false, bot: false, setup: null, personaName: "" };
const MAX_DOM = 800;
const $ = (id) => document.getElementById(id);
const stream = $("stream"), list = $("list"), chatsEl = $("chats");
const api = (p, o) => fetch(p, o || {}).then(r => r.json()).catch(() => null);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const atBottom = () => stream.scrollHeight - stream.scrollTop - stream.clientHeight < 60;
const toBottom = () => { stream.scrollTop = stream.scrollHeight; };
function updateJump() { $("jump").style.display = atBottom() ? "none" : "block"; }
stream.addEventListener("scroll", updateJump);

function setPill(id, cls, text) {
  const el = $(id); el.className = "pill " + cls;
  el.querySelector("span").textContent = text;
}

function renderChats(force) {
  const sig = JSON.stringify(S.chats) + S.active;
  if (!force && sig === S.sig) return;
  S.sig = sig;
  chatsEl.innerHTML = "";
  S.chats.forEach(c => {
    const d = document.createElement("div");
    const icon = c.key === "all" ? "全" : (c.name.indexOf("私聊") === 0 ? "私" : "群");
    d.className = "chat" + (c.key === S.active ? " active" : "") + (c.unread > 0 ? " has-unread" : "");
    const sub = c.count + " 条" + (c.unread > 0 ? " · 有新的" : "");
    d.innerHTML =
      '<div class="avatar">' + icon + "</div>" +
      '<div class="meta"><div class="name">' + esc(c.name) + "</div>" +
      '<div class="sub">' + sub + "</div></div>";
    d.onclick = () => switchChat(c.key);
    chatsEl.appendChild(d);
  });
}

function line(m) {
  const cls = m.kind === "out" ? "out" : (m.kind === "sys" ? "sys" : "in");
  const el = document.createElement("div");
  el.className = "line " + cls;
  el.dataset.text = (m.who + " " + m.text).toLowerCase();
  el.innerHTML =
    '<span class="t">' + esc(m.t) + "</span>" +
    '<span class="arrow">' + (cls === "out" ? "→" : " ") + "</span>" +
    '<span class="who">' + esc(m.who) + "：</span>" +
    '<span class="txt">' + esc(m.text) + "</span>";
  return el;
}

let emptySig = "";
function renderEmpty(force) {
  const el = $("empty");
  if (!el) return;
  if (list.children.length > 0) { el.style.display = "none"; return; }
  const hasKey = !!(S.setup && S.setup.hasKey);
  const sig = [S.napcat, S.bot, hasKey].join("|");
  if (!force && sig === emptySig) { el.style.display = "block"; return; }
  emptySig = sig;

  const steps = [
    { ok: S.napcat, text: "让 NapCat 登录，状态栏「NapCat」变绿" },
    { ok: hasKey, text: "填一次 API Key（设置向导）" },
    { ok: S.bot, text: "点右上角「启动」，扫码登录" },
  ];
  el.innerHTML =
    "<b>还没有消息</b>" +
    '<div class="guideList">' +
    steps.map((s) => '<div class="' + (s.ok ? "ok" : "") + '">' + (s.ok ? "✔ " : "○ ") + esc(s.text) + "</div>").join("") +
    "</div>" +
    '<button class="linkbtn" id="emptyGuide">完整新手指引 →</button>';
  el.style.display = "block";

  const btn = el.querySelector("#emptyGuide");
  if (btn) btn.onclick = openGuide;
}
function updateEmpty() { renderEmpty(true); }
function trimDom() {
  while (list.children.length > MAX_DOM) list.removeChild(list.firstChild);
}

function applyFilter() {
  const q = S.q.trim().toLowerCase();
  let shown = 0;
  for (let i = 0; i < list.children.length; i++) {
    const el = list.children[i];
    const hit = !q || (el.dataset.text || "").indexOf(q) >= 0;
    el.classList.toggle("hide", !hit);
    el.classList.toggle("hit", !!q && hit);
    if (hit) shown++;
  }
  $("found").textContent = q ? ("匹配 " + shown + " 条") : "";
}

async function loadMessages(reset) {
  const after = reset ? 0 : S.seq;
  const data = await api("/api/messages?chat=" + encodeURIComponent(S.active) + "&after=" + after);
  if (!data) return;
  const stick = reset || atBottom();
  if (reset) list.innerHTML = "";
  (data.lines || []).forEach(m => list.appendChild(line(m)));
  if (data.seq) S.seq = data.seq;
  trimDom(); updateEmpty(); applyFilter();
  if (stick) toBottom();
  updateJump();
  $("count").textContent = (data.total || 0) + " 条消息";
}

function switchChat(key) {
  if (S.active === key) return;
  S.active = key; S.seq = 0; S.q = ""; $("q").value = "";
  $("found").textContent = "";
  list.innerHTML = ""; updateEmpty(); renderChats(true);
  loadMessages(true);
}

async function refresh() {
  const s = await api("/api/state");
  if (!s) return false;

  setPill("p-napcat", s.napcat ? "ok" : (s.webui ? "warn" : "bad"),
    "NapCat " + (s.napcat ? "运行中" : (s.webui ? "待登录" : "未运行")));
  setPill("p-account", s.napcat ? "ok" : (s.webui ? "warn" : "bad"),
    "账号 " + (s.napcat ? "在线" : (s.webui ? "待扫码" : "离线")));
  setPill("p-bot", s.bot ? "ok" : "bad", "机器人 " + (s.bot ? "在线" : "未启动"));
  $("btn-start").disabled = !!s.bot;
  $("btn-stop").disabled = !s.bot;
  // 只留一个主按钮：没跑显示「启动」，跑起来换成「停止」
  $("btn-start").hidden = !!s.bot;
  $("btn-stop").hidden = !s.bot;
  $("hint").textContent = s.napcatDir === "" ? "没找到 NapCat，请在 app.json 里填 napcatDir" : (s.hint || "就绪");

  S.napcat = !!s.napcat;
  S.bot = !!s.bot;
  if (list.children.length === 0) renderEmpty(false);

  const sel = $("level");
  if (s.level && document.activeElement !== sel && sel.value !== s.level) sel.value = s.level;

  const send = $("btn-send");
  const sendBox = $("sendbox");
  send.disabled = !s.bot;
  sendBox.disabled = !s.bot;
  sendBox.placeholder = s.bot ? "以" + (S.personaName || "机器人") + "的身份发一句（Enter 发送）" : "机器人没在运行，先点「启动」";

  if (typeof s.gen === "number" && s.gen !== S.gen) {
    const first = S.gen === -1;
    S.gen = s.gen;
    if (!first) { list.innerHTML = ""; S.seq = 0; updateEmpty(); loadMessages(true); }
  }

  S.chats = s.chats || [];
  renderChats(false);

  const box = $("qrbox");
  if (s.qr) {
    if (box.style.display !== "block") { $("qrimg").src = s.qr; box.style.display = "block"; }
  } else if (box.style.display !== "none") {
    box.style.display = "none"; $("qrimg").src = "";
  }
  return true;
}

function renderMemory(m) {
  m = m || {};
  const facts = (m.facts || []).map((f) => (typeof f === "string" ? { text: f, at: 0, pinned: false } : f));
  const events = (m.events || []).map((e) => (typeof e === "string" ? { text: e, at: 0 } : e));
  const mood = typeof m.mood === "number" ? m.mood : 60;
  const ageOf = (at) => {
    if (!at) return "";
    const days = Math.floor((Date.now() - at) / 86400000);
    return days <= 0 ? "今天" : days === 1 ? "昨天" : days + " 天前";
  };

  $("membody").innerHTML =
    "<h4>群近况</h4><div class=\"summary\">" + (m.summary ? esc(m.summary) : "（还没总结过）") + "</div>" +
    "<h4>最近发生的事（" + events.length + " 条）</h4>" +
    (events.length
      ? "<ul class=\"factlist\">" + events.map((e, i) =>
          "<li><span>" + esc(e.text) + "</span><span class=\"factmeta\">" + ageOf(e.at) + "</span></li>").join("") + "</ul>"
      : "<div class=\"summary\">暂无</div>") +
    "<h4>记得的事（" + facts.length + " 条）</h4>" +
    (facts.length
      ? "<ul class=\"factlist\">" + facts
          .map((f, i) => {
            const days = f.at ? Math.floor((Date.now() - f.at) / 86400000) : null;
            const age = days === null ? "" : days <= 0 ? "今天" : days + " 天前";
            return "<li>" +
              "<span>" + (f.pinned ? "📌 " : "") + esc(f.text) + "</span>" +
              "<span class=\"factmeta\">" + age + "</span>" +
              "<button data-pin=\"" + i + "\" data-on=\"" + (f.pinned ? "1" : "0") + "\">" + (f.pinned ? "取消置顶" : "置顶") + "</button>" +
              "<button data-del=\"" + i + "\">删除</button>" +
              "</li>";
          })
          .join("") + "</ul>"
      : "<div class=\"summary\">暂无</div>") +
    "<p class=\"hintline\">置顶的不会被遗忘；平时只按和当前话题的相关度挑几条放进 prompt，不是全塞。</p>" +
    "<h4>心情 " + mood + "/100</h4>" +
    "<input type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"" + mood + "\" id=\"moodRange\" style=\"width:100%\">" +
    "<div class=\"moodbar\"><span style=\"width:" + mood + "%\"></span></div>" +
    "<h4>消息累计</h4><div class=\"summary\">" + (m.count || 0) + " 条</div>" +
    "<h4>操作</h4><div style=\"display:flex;gap:8px;flex-wrap:wrap\">" +
    "<button id=\"memClearFacts\">清空事实</button>" +
    "<button id=\"memClearSummary\">清空摘要</button>" +
    "<button id=\"memPrompt\">看这次发给模型的</button>" +
    "<button id=\"memReset\" class=\"danger\">重置记忆（摘要+事实）</button>" +
    "</div>" +
    "<p class=\"hintline\">重置记忆不会清掉最近上下文；要连这段对话一起忘，用顶栏「清理」并勾上「最近上下文」。</p>";

  $("membody").querySelectorAll("[data-del]").forEach((b) => {
    b.onclick = async () => {
      await memoryAction("forgetFact", { index: Number(b.dataset.del) });
      setTimeout(refreshMemoryPanel, 900);
    };
  });

  $("membody").querySelectorAll("[data-pin]").forEach((b) => {
    b.onclick = async () => {
      await memoryAction("pinFact", { index: Number(b.dataset.pin), pinned: b.dataset.on !== "1" });
      setTimeout(refreshMemoryPanel, 900);
    };
  });

  const range = $("moodRange");
  if (range) {
    range.onchange = async () => {
      await memoryAction("setMood", { value: Number(range.value) });
      setTimeout(refreshMemoryPanel, 900);
    };
  }

  const cf = $("memClearFacts");
  if (cf) cf.onclick = async () => { await memoryAction("clearFacts"); setTimeout(refreshMemoryPanel, 900); };

  const cs = $("memClearSummary");
  if (cs) cs.onclick = async () => { await memoryAction("clearSummary"); setTimeout(refreshMemoryPanel, 900); };

  const mp = $("memPrompt");
  if (mp) mp.onclick = openPromptView;

  const rs = $("memReset");
  if (rs) rs.onclick = async () => {
    if (!confirm("确定把这个会话的记忆全部清掉吗？")) return;
    await memoryAction("resetGroup");
    setTimeout(refreshMemoryPanel, 900);
  };
}

const modalStack = [];
function openModal(opts) {
  const mask = document.createElement("div");
  mask.className = "mask";
  const dlg = document.createElement("div");
  dlg.className = "dialog";
  if (opts.width) dlg.style.width = opts.width;

  dlg.innerHTML =
    '<header><b>' + esc(opts.title || "") + '</b><button class="x" data-close>关闭</button></header>' +
    '<div class="body">' + (opts.bodyHtml || "") + "</div>" +
    (opts.footHtml ? '<div class="foot">' + opts.footHtml + "</div>" : "");

  mask.appendChild(dlg);
  $("modals").appendChild(mask);

  const handle = {
    el: mask,
    dlg: dlg,
    body: dlg.querySelector(".body"),
    foot: dlg.querySelector(".foot"),
    close() {
      const i = modalStack.indexOf(handle);
      if (i >= 0) modalStack.splice(i, 1);
      mask.remove();
    },
  };

  dlg.querySelector("[data-close]").onclick = () => handle.close();
  mask.addEventListener("click", (e) => {
    if (e.target === mask) handle.close();
  });

  modalStack.push(handle);
  return handle;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalStack.length) modalStack[modalStack.length - 1].close();
});

  async function saveStep() {
    if (S.step === 2) {
      const key = (body.querySelector("#suKey").value || "").trim();
      const baseUrl = (body.querySelector("#suBase").value || "").trim();
      const model = (body.querySelector("#suModel").value || "").trim();
      if (!key && !(S.setup && S.setup.hasKey)) {
        body.querySelector("#suKey").focus();
        body.insertAdjacentHTML("beforeend", '<p class="hintline" style="color:#c0392b">先填一个 API Key 再继续</p>');
        return false;
      }
      const payload = { provider: "openai", baseUrl: baseUrl, model: model };
      if (key) payload.apiKey = key;
      const r = await api("/api/config", { method: "POST", body: JSON.stringify(payload) });
      if (!r || !r.ok) {
        body.insertAdjacentHTML("beforeend", '<p class="hintline" style="color:#c0392b">保存失败：' + esc((r && r.error) || "未知错误") + "</p>");
        return false;
      }
      S.setup = Object.assign({}, S.setup, { hasKey: true, baseUrl: baseUrl, model: model });
    }
    if (S.step === 3) {
      const text = body.querySelector("#suPersona").value;
      const name = (body.querySelector("#suName").value || "").trim();
      const payload = { text: text };
      if (name) payload.name = name;
      const r = await api("/api/persona", { method: "POST", body: JSON.stringify(payload) });
      if (!r || !r.ok) {
        body.insertAdjacentHTML("beforeend", '<p class="hintline" style="color:#c0392b">保存失败：' + esc((r && r.error) || "未知错误") + "</p>");
        return false;
      }
      if (name) {
        S.name = name;
        S.personaName = name;
        S.setup = Object.assign({}, S.setup, { personaName: name });
        const box = $("sendbox");
        if (box) box.placeholder = "以" + name + "的身份发一句（Enter 发送）";
      }
    }
    return true;
  }

  prev.onclick = () => {
    if (S.step > 1) {
      S.step -= 1;
      render();
    }
  };
  next.onclick = async () => {
    if (S.step === 4) {
      h.close();
      return;
    }
    if (!(await saveStep())) return;
    S.step += 1;
    render();
  };
  render();
}

async function openClear() {
  const chat = S.active;
  const isAll = chat === "all";
  const mem = (await api("/api/memory?chat=" + encodeURIComponent(chat))) || {};
  const facts = Array.isArray(mem.facts) ? mem.facts : [];

  const h = openModal({
    title: "清理",
    width: "540px",
    bodyHtml:
      '<div class="field"><label>范围</label><select id="clScope">' +
      '<option value="chat"' + (isAll ? " disabled" : "") + ">当前会话" + (isAll ? "（先在左侧选一个）" : "（" + esc(chat) + "）") + "</option>" +
      '<option value="all">全部会话</option>' +
      "</select></div>" +
      '<div class="field"><label>清掉什么（可多选，互不影响）</label></div>' +
      '<label class="chk"><input type="checkbox" id="clDisplay" checked> 屏幕记录 <span class="muted">界面显示 + data/ui.log，重启不会复活</span></label>' +
      '<label class="chk"><input type="checkbox" id="clContext"> 最近上下文 <span class="muted">它这轮对话还记着的最近消息，清完就当没聊过</span></label>' +
      '<label class="chk"><input type="checkbox" id="clMemory"> 长期记忆 <span class="muted">摘要 ' + (mem.summary ? 1 : 0) + ' 条 / 事实 ' + facts.length + ' 条 / 心情值</span></label>' +
      (st.bot ? "" : '<p class="hintline" style="color:#b45309">机器人没在运行：长期记忆仍可以直接清（写入 data/memory.json）；「最近上下文」本来就在它内存里，没运行等于已经没了。</p>') +
      '<p class="hintline">只清屏不会改变它怎么说话；清上下文只影响这段对话；清记忆才会删掉摘要与事实卡，且不能撤销。</p>',
    footHtml: '<button id="clCancel">取消</button><button id="clGo" class="danger">清理</button>',
  });

  const $b = (id) => h.body.querySelector("#" + id);
  h.foot.querySelector("#clCancel").onclick = () => h.close();

  h.foot.querySelector("#clGo").onclick = async () => {
    const scope = $b("clScope").value;
    const display = $b("clDisplay").checked;
    const context = $b("clContext").checked;
    const memory = $b("clMemory").checked;
    if (!display && !context && !memory) {
      $("hint").textContent = "至少勾一项再清理";
      return;
    }
    if (memory || context) {
      const what = [memory ? "长期记忆" : "", context ? "最近上下文" : ""].filter(Boolean).join("和");
      if (!confirm("确定要清掉" + what + "吗？这一步不能撤销。")) return;
    }

    const r = await api("/api/clear", {
      method: "POST",
      body: JSON.stringify({ scope: scope, chat: chat, display: display, context: context, memory: memory }),
    });
    if (!r || !r.ok) {
      $("hint").textContent = (r && r.error) || "清理失败";
      return;
    }

    h.close();
    list.innerHTML = "";
    S.seq = 0;
    updateEmpty();
    applyFilter();
    $("hint").textContent = "已清理";
    await refresh();
    await loadMessages(true);
    if (memory || context) setTimeout(refreshMemoryPanel, 800);
  };
}

// ---------------- 统计图 ----------------
async function openStats() {
  const h = openModal({ title: "命中率统计（最近 24 小时）", bodyHtml: '<div class="hintline">读取中…</div>' });
  const data = await api("/api/stats?hours=24");
  const hours = (data && data.hours) || [];
  const totalRecv = hours.reduce((a, b) => a + b.received, 0);
  const totalRepl = hours.reduce((a, b) => a + b.replied, 0);
  const rate = totalRecv ? Math.round((totalRepl / totalRecv) * 100) : 0;

  h.body.innerHTML =
    '<div class="kv" style="margin-bottom:14px">' +
    "<div>收到</div><div>" + totalRecv + " 条</div>" +
    "<div>回复</div><div>" + totalRepl + " 条</div>" +
    "<div>命中率</div><div><b style=\"color:var(--accent)\">" + rate + "%</b>（回复 / 收到）</div>" +
    "</div>" +
    '<svg class="chart" viewBox="0 0 680 200" preserveAspectRatio="none">' + chartSvg(hours) + "</svg>" +
    '<div class="hintline" style="margin-top:6px">浅绿＝收到，深绿＝回复，横轴为整点</div>';
}

function chartSvg(hours) {
  const W = 680, H = 200, padL = 30, padR = 8, padT = 12, padB = 24;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const max = Math.max(1, ...hours.map((x) => x.received));
  const n = hours.length || 1;
  const slot = innerW / n;
  const barW = Math.max(2, slot * 0.34);

  let g = "";
  // 横向参考线
  for (let i = 0; i <= 4; i += 1) {
    const y = padT + (innerH * i) / 4;
    const val = Math.round(max - (max * i) / 4);
    g += '<line class="axis" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"/>';
    g += '<text x="2" y="' + (y + 3) + '">' + val + "</text>";
  }

  hours.forEach((h, i) => {
    const x = padL + i * slot;
    const hr = (h.received / max) * innerH;
    const hp = (h.replied / max) * innerH;
    if (h.received) {
      g += '<rect class="bar-recv" x="' + (x + slot * 0.16) + '" y="' + (padT + innerH - hr) + '" width="' + barW + '" height="' + hr + '" rx="2"/>';
    }
    if (h.replied) {
      g += '<rect class="bar-repl" x="' + (x + slot * 0.16 + barW + 1) + '" y="' + (padT + innerH - hp) + '" width="' + barW + '" height="' + hp + '" rx="2"/>';
    }
    if (i % 4 === 0) {
      g += '<text x="' + (x + slot * 0.16) + '" y="' + (H - 6) + '">' + h.label + "</text>";
    }
  });

  return g;
}

function applyTheme(name, custom) {
  const styleEl = $("themeVars");

  styleEl.textContent =
    ":root{" + Object.entries(vars).map(([k, v]) => k + ":" + v).join(";") + "}" +
    (theme && theme.extra ? theme.extra : "");
  localStorage.setItem("qqbot-theme", JSON.stringify({ name: name, custom: custom || null }));
}

    .map(
      (k) =>
        "<div>" + labels[k] + '</div><div><input type="color" data-var="' + k + '" value="' + (vars[k] || "#ffffff") + '"></div>'
    )
    .join("");

  el.querySelectorAll("[data-theme]").forEach((sw) => {
    sw.onclick = () => {
      applyTheme(sw.dataset.theme);
      paintTheme(el);
    };
  });

  el.querySelector("#themeApply").onclick = () => {
    const out = {};
    el.querySelectorAll("[data-var]").forEach((i) => {
      out[i.dataset.var] = i.value;
    });
    applyTheme("custom", out);
    paintTheme(el);
  };

  el.querySelector("#themeReset").onclick = () => {
    localStorage.removeItem("qqbot-theme");
    applyTheme("light");
    paintTheme(el);
  };
}

// ---------------- 记忆编辑 ----------------
function memoryAction(cmd, extra) {
  if (S.active === "all") {
    $("hint").textContent = "先在左侧选一个会话，再编辑它的记忆";
    return Promise.resolve(null);
  }
  return api("/api/control", {
    method: "POST",
    body: JSON.stringify(Object.assign({ cmd: cmd, chat: S.active }, extra || {})),
  });
}

async function refreshMemoryPanel() {
  const m = await api("/api/memory?chat=" + encodeURIComponent(S.active));
  renderMemory(m);
}


loadTheme();
loadPersonaName();
refresh().then(() => loadMessages(true)).then(() => { tick(); maybeSetup(); });
</script>
