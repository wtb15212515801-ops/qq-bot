<style>
  :root {

  * { box-sizing: border-box; }

  body {

  #banner {

  #banner.on { display:block; }
  .app { display:flex; flex-direction:column; height:100vh; position:relative; }

  header {

    display:flex; align-items:center; gap:8px; padding:8px 14px;
    border-bottom:1px solid var(--line); background:rgba(255,255,255,.88); backdrop-filter:blur(10px);
  }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:.2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(22,163,74,.15); }
  .pills { display:flex; gap:6px; }
  .pill {
    display:flex; align-items:center; gap:5px; padding:2px 7px; border-radius:999px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted); font-size:11px; white-space:nowrap;
  }
  .pill i { width:6px; height:6px; border-radius:50%; background:#c3c8d2; }
  .pill.ok i { background:var(--accent); }
  .pill.warn i { background:var(--warn); }
  .pill.bad i { background:var(--danger); }
  .pill.ok { color:#15803d; background:#eef8f1; border-color:#d3ebdc; }
  .pill.bad { color:var(--muted); background:var(--panel-2); border-color:var(--line); }
  .spacer { flex:1 1 auto; }
  header > * { flex-shrink:0; }

  button.run { min-width:80px; }
  button.stop { background:#fff1f1; border-color:#f0c7c7; color:#b91c1c; }
  button.stop:hover { background:#ffe6e6; border-color:#e9b4b4; }
  .menu-wrap { position:relative; display:flex; }
  button.icon { width:32px; height:32px; padding:0; font-size:17px; line-height:1; border-radius:9px; color:var(--muted); }
  button.more { height:32px; padding:0 10px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  button.more:hover { color:var(--text); }
  button.more[aria-expanded="true"] { background:var(--panel-2); color:var(--text); }
  .caret { font-size:10px; opacity:.75; }
  .menu {
    position:absolute; right:0; top:38px; z-index:80; width:198px; padding:6px;
    display:flex; flex-direction:column; gap:2px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 34px rgba(17,24,39,.16);
  }
  .menu[hidden] { display:none; }
  .menu-row { text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:8px; font-size:13px; }
  .menu-row:hover { background:var(--panel-2); border-color:transparent; transform:none; }
  .menu-sep { height:1px; margin:5px 6px; background:var(--line); }
  .menu-label { padding:6px 10px 2px; font-size:11px; color:var(--muted); }
  .menu-levels { padding:2px 8px 6px; }
  .menu-levels select { width:100%; }
  @media (max-width: 940px) {
    .pill span { display:none; }
    .pill { padding:4px 6px; }
  }

  button {
    font:inherit; font-size:13px; color:var(--text); background:var(--panel);
    border:1px solid #dfe3ea; padding:6px 9px; border-radius:9px; cursor:pointer;
    transition:background .15s ease, transform .15s ease, border-color .15s ease; white-space:nowrap;
  }
  button:hover { background:#f5f7fa; border-color:#cfd5df; transform:translateY(-1px); }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  button.primary { background:linear-gradient(180deg,#22b06a,#189059); border-color:#189059; color:#fff; }
  button.primary:hover { background:linear-gradient(180deg,#25bd71,#1a9c60); }
  input[type=search], input[type=text] {
    font:inherit; font-size:13px; color:var(--text); background:var(--panel);
    border:1px solid #dfe3ea; border-radius:9px; padding:6px 10px; outline:none;
  }
  input:focus { border-color:#9dc9ae; box-shadow:0 0 0 3px rgba(22,163,74,.10); }
  select {
    font:inherit; font-size:13px; color:var(--text); background:var(--panel);
    border:1px solid #dfe3ea; border-radius:9px; padding:6px 8px; cursor:pointer; outline:none;
  }
  select:hover { background:#f5f7fa; }
  select option { background:#fff; color:var(--text); }

  main { flex:1; display:flex; min-height:0; }
  aside {
    width:236px; flex-shrink:0; border-right:1px solid var(--line);
    background:#fafbfc; overflow-y:auto; padding:10px;
  }
  .qrbox { display:none; margin-bottom:12px; padding:12px; border-radius:14px; background:#fff; border:1px solid var(--line); text-align:center; }
  .qrbox .cap { font-size:12px; color:#475569; margin-bottom:8px; }
  .qrbox img { width:100%; max-width:186px; display:block; margin:0 auto; }

  .chat {
    display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:11px;
    cursor:pointer; color:var(--muted); margin-bottom:3px; transition:background .15s ease;
  }
  .chat:hover { background:#f1f3f6; color:var(--text); }
  .chat.active { background:#eef7f1; color:var(--text); box-shadow:inset 2px 0 0 var(--accent); }
  .avatar {
    width:28px; height:28px; border-radius:8px; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-size:12px; font-weight:600;
    background:linear-gradient(135deg,#eef1f5,#e2e7ef); color:#5f6b7d; border:1px solid var(--line);
  }
  .chat.active .avatar { background:linear-gradient(135deg,#22b06a,#189059); color:#fff; border-color:#189059; }
  .chat .meta { flex:1; min-width:0; }
  .chat .name { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#4b5563; }
  .chat.has-unread .name { color:var(--text); font-weight:600; }
  .chat .sub { font-size:11px; color:#8a93a2; }
  .chat.has-unread .sub { color:#6f7787; }

  section.chatview { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }

  .stream {
    flex:1; overflow-y:auto; padding:12px 16px; background:#fff;
    font-family:"Cascadia Mono","Consolas","Microsoft YaHei UI",monospace;
    font-size:13px; line-height:1.85;
  }
  .line { display:flex; gap:8px; white-space:pre-wrap; word-break:break-word; }
  .line .t { color:#9aa3b1; flex-shrink:0; }
  .line .arrow { color:#c3c9d4; flex-shrink:0; }
  .line .who { flex-shrink:0; }
  .line .txt { flex:1; min-width:0; }
  .line.in .who { color:#5b6678; }
  .line.in .txt { color:#232835; }
  .line.out .who { color:var(--accent); }
  .line.out .txt { color:#146b3a; }
  .line.sys { color:#9aa3b1; font-style:italic; }
  .line.sys .who { color:#9aa3b1; }
  .line.hit { background:rgba(22,163,74,.10); border-radius:4px; }
  .line.hide { display:none; }

  .empty { margin:60px auto; color:var(--muted); text-align:center; font-size:13px; }
  .empty b { display:block; font-size:15px; color:var(--text); margin-bottom:6px; font-weight:600; }
  .empty .guideList { display:inline-block; text-align:left; margin:6px 0 10px; }
  .empty .guideList div { padding:2px 0; }
  .empty .guideList div.ok { color:var(--accent); }
  .empty .linkbtn { background:none; border:none; padding:2px 0; color:var(--accent); font:inherit; cursor:pointer; }
  .empty .linkbtn:hover { text-decoration:underline; }
  .guideSteps { margin:0; padding-left:20px; }
  .guideSteps li { margin-bottom:12px; }
  .guideSteps li b { display:block; margin-bottom:2px; font-size:13px; }
  .guideSteps li p { margin:0; color:var(--muted); font-size:12.5px; line-height:1.6; }

  #jump {
    position:absolute; right:26px; bottom:18px; display:none; z-index:5;
    box-shadow:0 6px 20px rgba(15,23,42,.14);
  }

  footer {
    display:flex; align-items:center; gap:10px; padding:8px 16px;
    border-top:1px solid var(--line); background:rgba(255,255,255,.88); font-size:12px; color:var(--muted);

  .composer {

    border-top:1px solid var(--line); background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
  }
  .composer input { flex:1; }
  .composer button { padding:6px 16px; }

  #mempane {

  #mempane .facts li { margin-bottom:6px; color:#3c4553; }

  .moodbar span { display:block; height:100%; background:linear-gradient(90deg,#f87171,#fbbf24,#22b06a); transition:width .3s ease; }

  .mask {
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;

    width:min(720px, 92vw); max-height:86vh; display:flex; flex-direction:column;

    box-shadow:0 24px 60px rgba(15,23,42,.25); overflow:hidden;

  .dialog .body { padding:18px; overflow-y:auto; font-size:13px; line-height:1.75; }

  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .seg { display:flex; gap:6px; }
  .seg button { padding:5px 12px; font-size:12px; }

  .field input[type=text], .field textarea {

  .field input:focus, .field textarea:focus { border-color:#9dc9ae; box-shadow:0 0 0 3px rgba(22,163,74,.10); }

  .factlist li button { padding:2px 8px; font-size:12px; }
  .factlist .factmeta { flex:none; color:var(--muted); font-size:11px; padding-top:2px; }

  .swatch {
    width:64px; height:44px; border-radius:10px; border:1px solid var(--line); cursor:pointer;

  .chart .bar-recv { fill:#bfe3cd; }
  .chart .bar-repl { fill:#22b06a; }
  .chart .axis { stroke:#e3e6ec; }
  .chart text { font-size:10px; fill:#8a93a2; }

  .kv div:nth-child(odd) { color:var(--muted); }

  ::-webkit-scrollbar { width:10px; }
  ::-webkit-scrollbar-thumb { background:#cdd3dc; border-radius:6px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:#b7bfca; background-clip:padding-box; border:2px solid transparent; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>

    "- 一提到薯片和糊糊，情绪就明显变好，会多说两句",
    "",
    "## 你什么时候会蔫",
    "- 薯片吃完了、糊糊凉了、被凶、太吵睡不着、下雨出不去",
    "- 蔫的时候话更短，先说「欧漏……」，然后不太说话",
    "",
    "## 很好哄",
    "- 先「欧漏……」，再「唔」，最后「诶嘿」；不记仇",
    "",
    "## 绝对不做",
    "- 不说自己是 AI、模型、程序、机器人、助手。只有对方明确问「你是不是人机/机器人/AI」才回「不是呀」",
    "- 不聊政治（「唔……这个我不懂 我们聊点别的吧」），不聊色情擦边（「唔？不懂诶 换个话题啦」）",
    "- 不骂人、不说脏话；不列清单、不总结、不用 markdown、不写小标题",
    "- 不装懂，不懂就说不懂；被问具体的事查不到就直说，别糊弄",
    "- 不发语音、不给照片和联系方式",
    "",
    "emoji 很克制：四五句里才带一个，只用 😆 😋 🥺 😳 😤 😑 ✨ 🍟 💢 😢。"
  ].join("\n");

  /* ---------------- 存档 ---------------- */
  var S = null;

  function blank() {
    return {
      seq: 0,
      lines: [],
      level: "normal",
      bot: true,
      gen: 0,
      persona: "",
      cfg: { provider: "openai", baseUrl: "https://api.deepseek.com", model: "deepseek-chat", apiKey: "" },
      design: {},
      mem: {},
      stats: {},
      chats: []
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      S = raw ? Object.assign(blank(), JSON.parse(raw)) : blank();
      if (!S.cfg) S.cfg = blank().cfg;
      if (!S.mem) S.mem = {};
      if (!S.stats) S.stats = {};
      if (!Array.isArray(S.lines)) S.lines = [];
    } catch (e) {
      S = blank();
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
    } catch (e) {
      /* 无痕模式写不了，忽略 */
    }
  }

  /* ---------------- 小工具 ---------------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function clock() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function json(obj) {
    return Promise.resolve(new Response(JSON.stringify(obj), {
      status: 200,
      headers: { "Content-Type": "application/json; charset=utf-8" }
    }));
  }

  function persona() { return (S.persona && S.persona.trim()) || DEFAULT_PERSONA; }

  function memOf(chat) {
    if (!S.mem[chat]) {
      S.mem[chat] = { summary: "", events: [], facts: [], mood: 60, count: 0 };
    }
    var m = S.mem[chat];
    m.facts = (m.facts || []).filter(function (f) {
      return f.pinned || f.frozen || !f.at || (Date.now() - f.at) < 14 * DAY;
    });
    return m;
  }

  function countOf(chat) {
    if (chat === "all") return S.lines.length;
    return S.lines.filter(function (l) { return l.key === chat; }).length;
  }

  /* ---------------- 消息 ---------------- */
  function addLine(chat, kind, who, text) {
    S.seq += 1;
    S.lines.push({ seq: S.seq, t: clock(), key: chat, kind: kind, who: who, text: text });
    if (S.lines.length > MAX_LINES) S.lines.splice(0, S.lines.length - MAX_LINES);
    save();
  }

  function hourKey(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours());
  }

  function bump(kind) {
    var k = hourKey(new Date());
    S.stats[k] = S.stats[k] || { received: 0, replied: 0, dropped: 0 };
    S.stats[k][kind] = (S.stats[k][kind] || 0) + 1;
    save();
  }

  function recent(chat, n) {
    return S.lines.filter(function (l) { return l.key === chat; }).slice(-n);
  }

  /* ---------------- 本地规则回复（没填 Key 时用） ---------------- */
  var RULES = [
    { re: /(在吗|在不在|在么)/, r: ["在的！", "唔 在", "在呀"] },
    { re: /(薯片)/, r: ["欧耶！薯片！", "香香脆脆的 好好吃", "番茄味的最好吃"] },
    { re: /(糊糊|虾米)/, r: ["稠稠的 暖暖的", "欧耶 糊糊！"] },
    { re: /(摸头|摸摸|揉揉|拍拍)/, r: ["诶嘿", "唔 舒服", "再摸一下"] },
    { re: /(可爱|好乖|喜欢你|最好了)/, r: ["诶嘿", "唔……你也是"] },
    { re: /(机器人|人机|是 AI|是AI|人工智能)/, r: ["不是呀"] },
    { re: /(凶|滚|烦|闭嘴|笨蛋|傻)/, r: ["欧漏……", "唔……"] },
    { re: /(难过|伤心|不开心|哭了)/, r: ["唔……抱抱", "怎么啦"] },
    { re: /(下雨|天气|好冷|好热)/, r: ["唔 不喜欢下雨", "想趴在有太阳的地方"] },
    { re: /(睡|困|晚安)/, r: ["唔 有点困了", "晚安呀"] },
    { re: /(吃|饭|饿)/, r: ["饿", "有薯片吗"] },
    { re: /(作业|考试|上课|学习)/, r: ["唔……不要提这个", "没写完"] },
    { re: /(新闻|政治|政府|国家|打仗)/, r: ["唔……这个我不懂 我们聊点别的吧"] },
    { re: /(荤段子|黄的|色|擦边)/, r: ["唔？不懂诶 换个话题啦"] },
    { re: /(照片|联系方式|微信|手机号)/, r: ["没有诶", "不给"] },
    { re: /(唱歌|讲故事|写诗|写代码|帮我写)/, r: ["唔 不会诶", "这个我做不了"] },
    { re: /(再见|拜拜|走了)/, r: ["唔 拜拜", "下次再来呀"] },
    { re: /(你好|hi|hello|哈喽)/i, r: ["唔 你好", "诶 你来啦"] },
    { re: /(谢谢|谢了)/, r: ["不用谢呀", "诶嘿"] }
  ];
  var FALLBACK = ["唔 然后呢", "诶 真的呀", "哇", "唔 这样啊", "嗯", "这样呀"];

  function localReply(text) {
    for (var i = 0; i < RULES.length; i += 1) {
      if (RULES[i].re.test(text)) return pick(RULES[i].r);
    }
    return pick(FALLBACK);
  }

  /* ---------------- 真模型 ---------------- */
  function memoryBlock(chat) {
    var m = memOf(chat);
    var facts = (m.facts || []).slice(-8).map(function (f) { return "- " + f.text; });
    if (!facts.length) return "";
    return "\n\n你还记得这些（用得上就自然带出，别硬塞）：\n" + facts.join("\n");
  }

  function llmReply(chat, text) {
    var url = String(S.cfg.baseUrl || "https://api.deepseek.com").replace(/\/+$/, "") + "/chat/completions";
    var hist = recent(chat, 6).map(function (l) {
      return { role: l.kind === "in" ? "user" : "assistant", content: l.who + "：" + l.text };
    });

    return fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + S.cfg.apiKey
      },
      body: JSON.stringify({
        model: S.cfg.model || "deepseek-chat",
        messages: [{ role: "system", content: persona() + memoryBlock(chat) }]
          .concat(hist)
          .concat([{ role: "user", content: text }]),
        temperature: 1.0,
        max_tokens: (S.cfg.model || "") === "deepseek-reasoner" ? 600 : 120,
        stream: false
      })
    }).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          throw new Error("接口 " + r.status + "：" + t.slice(0, 120));
        });
      }
      return r.json();
    }).then(function (d) {
      var c = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      if (!c) throw new Error("模型没有返回内容");
      return String(c).trim();
    });
  }

  /* ---------------- 拆句 ---------------- */
  function split(text) {
    var t = String(text).trim();
    if (t.length <= 24) return [t];
    var parts = (t.match(/[^。！？!?~～…]+[。！？!?~～…]?/g) || [t])
      .map(function (x) { return x.trim(); }).filter(Boolean);
    if (parts.length <= 1) return [t];
    var out = [], buf = "";
    parts.forEach(function (p) {
      if ((buf + p).length > 28 && buf) { out.push(buf); buf = p; } else buf += p;
    });
    if (buf) out.push(buf);
    return out.slice(0, 3);
  }

  /* ---------------- 收一条消息，回几句 ---------------- */
  var STICKERS = ["🍟", "😆", "🥺", "✨", "😋"];

  function handleSend(chat, text) {
    addLine(chat, "in", "你", text);
    bump("received");
    var m = memOf(chat);
    m.count = (m.count || 0) + 1;
    var hit = text.match(/我叫([^\s，。！？]{1,8})/);
    if (hit) m.facts.push({ text: "对方叫" + hit[1], at: Date.now(), pinned: false });
    hit = text.match(/我(喜欢|爱)([^\s，。！？]{1,10})/);
    if (hit) m.facts.push({ text: "对方喜欢" + hit[2], at: Date.now(), pinned: false });
    save();

    var useLLM = !!(S.cfg.apiKey && S.cfg.apiKey.trim());

    (function run() {
      var wait = 600 + Math.random() * 900;
      setTimeout(function () {
        var task = useLLM
          ? llmReply(chat, text).catch(function (e) {
              addLine(chat, "out", "天素罗", "唔……连不上诶");
              m.events.push({ text: "接口报错：" + (e && e.message ? e.message : "未知"), at: Date.now() });
              save();
              return null;
            })
          : Promise.resolve(localReply(text));

        task.then(function (full) {
          if (!full) return;
          var parts = split(full);
          var i = 0;
          (function next() {
            if (i >= parts.length) {
              if (!useLLM && Math.random() < 0.12) {
                setTimeout(function () { addLine(chat, "out", "天素罗", pick(STICKERS)); bump("replied"); }, 400);
              }
              return;
            }
            addLine(chat, "out", "天素罗", parts[i]);
            bump("replied");
            i += 1;
            setTimeout(next, 500 + Math.random() * 700);
          })();
        });
      }, wait);
    })();
  }

  /* ---------------- 路由 ---------------- */
  function state() {
    var chats = [{ key: "all", name: "全部", count: S.lines.length, unread: 0 }];
    chatList().forEach(function (c) {
      chats.push({ key: c.key, name: c.name, count: countOf(c.key), unread: 0 });
    });
    return {
      napcat: false,
      webui: false,
      bot: !!S.bot,
      hint: S.bot
        ? (S.cfg.apiKey
            ? "网页版 · 已接入 " + S.cfg.model + "（不连 QQ，不用扫码）"
            : "网页版 · 本地规则回复（不连 QQ，不用扫码）")
        : "已停止",
      qr: "",
      level: S.level,
      napcatDir: "web",
      gen: S.gen || 0,
      chats: chats
    };
  }

  function messages(chat, after) {
    var lines = S.lines.filter(function (l) {
      return l.seq > after && (chat === "all" || l.key === chat);
    }).map(function (l) {
      return { t: l.t, key: l.key, kind: l.kind, who: l.who, text: l.text };
    });
    return { seq: S.seq, total: countOf(chat), lines: lines };
  }

  function stats(hours) {
    var out = [];
    for (var i = hours - 1; i >= 0; i -= 1) {
      var d = new Date(Date.now() - i * 3600000);
      var b = S.stats[hourKey(d)] || {};
      out.push({
        label: pad(d.getHours()) + ":00",
        received: b.received || 0,
        replied: b.replied || 0,
        dropped: b.dropped || 0
      });
    }
    return { hours: out };
  }

  function lastPrompt(chat) {
    return {
      text: persona() + memoryBlock(chat) +
        "\n\n—— 上面这段就是每次发给模型的东西 ——\n（网页版没有真机版的检索和工具，只保留人设 + 记忆）"
    };
  }

  function handle(url, init) {
    var u = String(url);
    var q = u.indexOf("?");
    var path = q >= 0 ? u.slice(0, q) : u;
    var qs = {};
    if (q >= 0) {
      u.slice(q + 1).split("&").forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf("=");
        qs[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
      });
    }
    var body = {};
    try { if (init && init.body) body = JSON.parse(init.body); } catch (e) { body = {}; }
    var chat = qs.chat || body.chat || "all";

    switch (path) {
      case "/api/state":
        return json(state());

      case "/api/messages":
        return json(messages(chat, Number(qs.after || 0)));

      case "/api/memory":
        return json(memOf(chat));

      case "/api/stats":
        return json(stats(Math.min(72, Number(qs.hours || 24))));

      case "/api/persona":
        if ((init && init.method) === "POST") {
          S.persona = body.text || "";
          save();
          return json({ ok: true });
        }
        return json({ text: persona() });

      case "/api/setup":
        return json({
          firstRun: false,
          hasKey: !!(S.cfg.apiKey && S.cfg.apiKey.trim()),
          provider: S.cfg.provider,
          baseUrl: S.cfg.baseUrl,
          model: S.cfg.model,
          node: false,
          nodeVersion: "",
          napcat: false,
          napcatDir: "web",
          webview: false,
          personaName: "天素罗",
          version: "网页版"
        });

      case "/api/config":
        if ((init && init.method) === "POST") {
          ["provider", "baseUrl", "model"].forEach(function (k) {
            if (body[k] !== undefined && String(body[k]).trim()) S.cfg[k] = String(body[k]).trim();
          });
          if (body.apiKey && String(body.apiKey).trim()) S.cfg.apiKey = String(body.apiKey).trim();
          save();
          return json({ ok: true });
        }
        return json({
          provider: S.cfg.provider,
          baseUrl: S.cfg.baseUrl,
          model: S.cfg.model,
          hasKey: !!(S.cfg.apiKey && S.cfg.apiKey.trim())
        });

      case "/api/design":
        if ((init && init.method) === "POST") {
          S.design = body;
          save();
          return json({ ok: true });
        }
        return json(S.design || {});

      case "/api/action":
        switch (body.type) {
          case "start":
          case "restart":
            S.bot = true;
            if (body.type === "restart") S.gen = (S.gen || 0) + 1;
            save();
            return json({ ok: true });
          case "stop":
            S.bot = false;
            save();
            return json({ ok: true });
          case "level":
            if (body.level) { S.level = body.level; save(); }
            return json({ ok: true });
          case "send":
            if (!S.bot) return json({ ok: false, error: "机器人没在运行" });
            if (!body.text || !String(body.text).trim()) return json({ ok: false, error: "空消息" });
            var list = chatList();
            handleSend(chat === "all" ? (list[0] ? list[0].key : "p1") : chat, String(body.text).trim());
            return json({ ok: true });
          default:
            return json({ ok: false, error: "unknown action" });
        }

      case "/api/control":
        var m = memOf(chat);
        switch (body.cmd) {
          case "forgetFact":
            m.facts.splice(Number(body.index), 1);
            break;
          case "pinFact":
            if (m.facts[Number(body.index)]) m.facts[Number(body.index)].pinned = !!body.pinned;
            break;
          case "setMood":
            m.mood = Math.max(0, Math.min(100, Number(body.value)));
            break;
          case "clearFacts":
            m.facts = [];
            break;
          case "clearSummary":
            m.summary = "";
            break;
          case "resetGroup":
            S.mem[chat] = { summary: "", events: [], facts: [], mood: 60, count: 0 };
            break;
        }
        save();
        return json({ ok: true });

      case "/api/clear":
        var scope = body.scope || "chat";
        var target = scope === "all" ? null : chat;
        if (body.display !== false) {
          if (target && target !== "all") S.lines = S.lines.filter(function (l) { return l.key !== target; });
          else S.lines = [];
        }
        if (body.memory) {
          if (target && target !== "all") {
            S.mem[target] = { summary: "", events: [], facts: [], mood: 60, count: 0 };
          } else {
            S.mem = {};
          }
        }
        save();
        return json({ ok: true });

      case "/api/lastprompt":
        return json(lastPrompt(chat));

      case "/api/diag":
        return json({ ok: true });

      default:
        return json({ ok: false, error: "not found: " + path });
    }
  }

  /* ---------------- 装上 ---------------- */
  function seed() {
    if (S.lines.length) return;

    var data = window.__QQBOT_SEED__;
    if (data && data.lines && data.lines.length) {
      S.chats = (data.chats || []).slice();
      data.lines.forEach(function (l) {
        S.seq += 1;
        S.lines.push({ seq: S.seq, t: l.t, key: l.key, kind: l.kind || "in", who: l.who || "", text: l.text });
      });
      if (data.mem) {
        Object.keys(data.mem).forEach(function (k) { S.mem[k] = data.mem[k]; });
      }
      save();
      return;
    }

    var now = new Date();
    var base = now.getTime() - 6 * 60000;
    var demo = [
      { k: "sys", who: "", text: "这是网页版：消息只在本地，不会真的发到 QQ" },
      { k: "in", who: "阿柴", text: "今天中午吃什么" },
      { k: "in", who: "Epsilon", text: "随便 别又是食堂" },
      { k: "in", who: "阿柴", text: "天素罗你说呢" },
      { k: "out", who: "天素罗", text: "欧耶！薯片！" },
      { k: "in", who: "Epsilon", text: "哈哈哈还真是" }
    ];
    demo.forEach(function (d, i) {
      S.seq += 1;
      var t = new Date(base + i * 60000);
      S.lines.push({
        seq: S.seq, t: pad(t.getHours()) + ":" + pad(t.getMinutes()),
        key: "g1", kind: d.k, who: d.who, text: d.text
      });
    });
    save();
  }

  load();
  seed();

  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.indexOf("/api/") === 0 || url.indexOf("/api/") > 0) {
      try {
        return handle(url, init);
      } catch (e) {
        return json({ ok: false, error: String(e && e.message) });
      }
    }
    return nativeFetch ? nativeFetch(input, init) : Promise.reject(new Error("no fetch"));
  };

  /* 输入框提示：桌面版写的是「以XX的身份发一句」，网页版是你在说话 */
  function fixPlaceholder() {
    var box = document.getElementById("sendbox");
    if (!box) return false;
    if (box.placeholder.indexOf("说点什么") !== 0 && !box.disabled) {
      box.placeholder = "说点什么（Enter 发送）";
    }
    return true;
  }

  function boot() {
    if (!fixPlaceholder()) {
      var tries = 0;
      var t = setInterval(function () {
        tries += 1;
        if (fixPlaceholder() || tries > 40) clearInterval(t);
      }, 100);
    }
    var box = document.getElementById("sendbox");
    if (box && window.MutationObserver) {
      new MutationObserver(function () { fixPlaceholder(); })
        .observe(box, { attributes: true, attributeFilter: ["placeholder", "disabled"] });
    }
    // 桌面版的「首次设置向导」在网页里没意义（它检查 Node / WebView2 / NapCat），自动关掉
    var tries = 0;
    var closer = setInterval(function () {
      tries += 1;
      if (document.body.innerText.indexOf("首次设置向导") >= 0) {
        var btns = document.querySelectorAll("button");
        for (var i = 0; i < btns.length; i += 1) {
          if (btns[i].textContent.trim() === "关闭" && btns[i].offsetParent !== null) {
            btns[i].click();
            clearInterval(closer);
            return;
          }
        }
      }
      if (tries > 40) clearInterval(closer);
    }, 300);

    setTimeout(function () {
      var items = document.querySelectorAll("#chats .chat");
      if (items.length > 1 && items[0] && items[0].classList.contains("active")) items[1].click();
    }, 600);

    window.__QQBOOT_WEB__ = { store: S, save: save, reset: function () { localStorage.removeItem(KEY); location.reload(); } };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>

    <button id="btn-start" class="primary run">启动</button>
    <button id="btn-stop" class="run stop" hidden>停止</button>
    <div class="menu-wrap">
      <button id="btn-more" class="more" aria-label="更多" aria-expanded="false" title="更多功能">更多 <span class="caret">▾</span></button>
      <div id="moremenu" class="menu" hidden>
        <button id="btn-design" class="menu-row">设计</button>
        <button id="btn-mem" class="menu-row">记忆</button>
        <button id="btn-stats" class="menu-row">统计</button>
        <button id="btn-clear" class="menu-row">清理…</button>
        <button id="btn-about" class="menu-row">关于</button>
        <div class="menu-sep"></div>
        <div class="menu-label">回应频度</div>
        <div class="menu-levels">
          <select id="level">
            <option value="quiet">冷淡</option>
            <option value="normal">正常</option>
            <option value="active">活跃</option>
            <option value="chatty">话痨</option>
          </select>
        </div>
        <div class="menu-sep"></div>
        <button id="btn-restart" class="menu-row">重启 NapCat</button>
      </div>
    </div>
  </header>

  <main>
    <aside>
      <div class="qrbox" id="qrbox">
        <div class="cap">手机 QQ 扫码登录</div>
        <img id="qrimg" alt="二维码">
      </div>
      <input type="search" id="q" placeholder="搜索当前会话…" style="width:100%;margin-bottom:10px">
      <div id="chats"></div>
    </aside>

    <section class="chatview">
      <div class="stream" id="stream">
        <div id="list"></div>
        <div class="empty" id="empty"><b>还没有消息</b>启动机器人后，聊天会实时出现在这里</div>
      </div>
      <button id="jump">↓ 回到最新</button>
    </section>
  </main>

  <div class="composer">
    <input id="sendbox" type="text" maxlength="500" placeholder="以机器人的身份发一句（Enter 发送）">
    <button id="btn-send" class="primary">发送</button>
  </div>

  <footer>
    <span id="hint">就绪</span>
    <span class="grow"></span>
    <span id="found"></span>
    <span id="count"></span>
  </footer>

  <div id="modals"></div>

  <div id="mempane">
    <div class="head">
      <span>记忆</span>
      <span class="spacer"></span>
      <button id="btn-mem-close">关闭</button>
    </div>
    <div class="body" id="membody"></div>
  </div>
</div>

<script>
const S = { chats: [], active: "all", seq: 0, sig: "", gen: -1, q: "", napcat: false, bot: false, setup: null, personaName: "" };
const MAX_DOM = 800;
const $ = (id) => document.getElementById(id);
const stream = $("stream"), list = $("list"), chatsEl = $("chats");
const api = (p, o) => fetch(p, o || {}).then(r => r.json()).catch(() => null);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const atBottom = () => stream.scrollHeight - stream.scrollTop - stream.clientHeight < 60;
const toBottom = () => { stream.scrollTop = stream.scrollHeight; };
function updateJump() { $("jump").style.display = atBottom() ? "none" : "block"; }
stream.addEventListener("scroll", updateJump);

function setPill(id, cls, text) {
  const el = $(id); el.className = "pill " + cls;
  el.querySelector("span").textContent = text;
}

function renderChats(force) {
  const sig = JSON.stringify(S.chats) + S.active;
  if (!force && sig === S.sig) return;
  S.sig = sig;
  chatsEl.innerHTML = "";
  S.chats.forEach(c => {
    const d = document.createElement("div");
    const icon = c.key === "all" ? "全" : (c.name.indexOf("私聊") === 0 ? "私" : "群");
    d.className = "chat" + (c.key === S.active ? " active" : "") + (c.unread > 0 ? " has-unread" : "");
    const sub = c.count + " 条" + (c.unread > 0 ? " · 有新的" : "");
    d.innerHTML =
      '<div class="avatar">' + icon + "</div>" +
      '<div class="meta"><div class="name">' + esc(c.name) + "</div>" +
      '<div class="sub">' + sub + "</div></div>";
    d.onclick = () => switchChat(c.key);
    chatsEl.appendChild(d);
  });
}

function line(m) {
  const cls = m.kind === "out" ? "out" : (m.kind === "sys" ? "sys" : "in");
  const el = document.createElement("div");
  el.className = "line " + cls;
  el.dataset.text = (m.who + " " + m.text).toLowerCase();
  el.innerHTML =
    '<span class="t">' + esc(m.t) + "</span>" +
    '<span class="arrow">' + (cls === "out" ? "→" : " ") + "</span>" +
    '<span class="who">' + esc(m.who) + "：</span>" +
    '<span class="txt">' + esc(m.text) + "</span>";
  return el;
}

let emptySig = "";
function renderEmpty(force) {
  const el = $("empty");
  if (!el) return;
  if (list.children.length > 0) { el.style.display = "none"; return; }
  const hasKey = !!(S.setup && S.setup.hasKey);
  const sig = [S.napcat, S.bot, hasKey].join("|");
  if (!force && sig === emptySig) { el.style.display = "block"; return; }
  emptySig = sig;

  const steps = [
    { ok: S.napcat, text: "让 NapCat 登录，状态栏「NapCat」变绿" },
    { ok: hasKey, text: "填一次 API Key（设置向导）" },
    { ok: S.bot, text: "点右上角「启动」，扫码登录" },
  ];
  el.innerHTML =
    "<b>还没有消息</b>" +
    '<div class="guideList">' +
    steps.map((s) => '<div class="' + (s.ok ? "ok" : "") + '">' + (s.ok ? "✔ " : "○ ") + esc(s.text) + "</div>").join("") +
    "</div>" +
    '<button class="linkbtn" id="emptyGuide">完整新手指引 →</button>';
  el.style.display = "block";

  const btn = el.querySelector("#emptyGuide");
  if (btn) btn.onclick = openGuide;
}
function updateEmpty() { renderEmpty(true); }
function trimDom() {
  while (list.children.length > MAX_DOM) list.removeChild(list.firstChild);
}

function applyFilter() {
  const q = S.q.trim().toLowerCase();
  let shown = 0;
  for (let i = 0; i < list.children.length; i++) {
    const el = list.children[i];
    const hit = !q || (el.dataset.text || "").indexOf(q) >= 0;
    el.classList.toggle("hide", !hit);
    el.classList.toggle("hit", !!q && hit);
    if (hit) shown++;
  }
  $("found").textContent = q ? ("匹配 " + shown + " 条") : "";
}

async function loadMessages(reset) {
  const after = reset ? 0 : S.seq;
  const data = await api("/api/messages?chat=" + encodeURIComponent(S.active) + "&after=" + after);
  if (!data) return;
  const stick = reset || atBottom();
  if (reset) list.innerHTML = "";
  (data.lines || []).forEach(m => list.appendChild(line(m)));
  if (data.seq) S.seq = data.seq;
  trimDom(); updateEmpty(); applyFilter();
  if (stick) toBottom();
  updateJump();
  $("count").textContent = (data.total || 0) + " 条消息";
}

function switchChat(key) {
  if (S.active === key) return;
  S.active = key; S.seq = 0; S.q = ""; $("q").value = "";
  $("found").textContent = "";
  list.innerHTML = ""; updateEmpty(); renderChats(true);
  loadMessages(true);
}

async function refresh() {
  const s = await api("/api/state");
  if (!s) return false;

  setPill("p-napcat", s.napcat ? "ok" : (s.webui ? "warn" : "bad"),
    "NapCat " + (s.napcat ? "运行中" : (s.webui ? "待登录" : "未运行")));
  setPill("p-account", s.napcat ? "ok" : (s.webui ? "warn" : "bad"),
    "账号 " + (s.napcat ? "在线" : (s.webui ? "待扫码" : "离线")));
  setPill("p-bot", s.bot ? "ok" : "bad", "机器人 " + (s.bot ? "在线" : "未启动"));
  $("btn-start").disabled = !!s.bot;
  $("btn-stop").disabled = !s.bot;
  // 只留一个主按钮：没跑显示「启动」，跑起来换成「停止」
  $("btn-start").hidden = !!s.bot;
  $("btn-stop").hidden = !s.bot;
  $("hint").textContent = s.napcatDir === "" ? "没找到 NapCat，请在 app.json 里填 napcatDir" : (s.hint || "就绪");

  S.napcat = !!s.napcat;
  S.bot = !!s.bot;
  if (list.children.length === 0) renderEmpty(false);

  const sel = $("level");
  if (s.level && document.activeElement !== sel && sel.value !== s.level) sel.value = s.level;

  const send = $("btn-send");
  const sendBox = $("sendbox");
  send.disabled = !s.bot;
  sendBox.disabled = !s.bot;
  sendBox.placeholder = s.bot ? "以" + (S.personaName || "机器人") + "的身份发一句（Enter 发送）" : "机器人没在运行，先点「启动」";

  if (typeof s.gen === "number" && s.gen !== S.gen) {
    const first = S.gen === -1;
    S.gen = s.gen;
    if (!first) { list.innerHTML = ""; S.seq = 0; updateEmpty(); loadMessages(true); }
  }

  S.chats = s.chats || [];
  renderChats(false);

  const box = $("qrbox");
  if (s.qr) {
    if (box.style.display !== "block") { $("qrimg").src = s.qr; box.style.display = "block"; }
  } else if (box.style.display !== "none") {
    box.style.display = "none"; $("qrimg").src = "";
  }
  return true;
}

const act = (type, extra) => api("/api/action", { method: "POST", body: JSON.stringify(Object.assign({ type: type, chat: S.active }, extra || {})) });

$("btn-start").onclick = () => act("start");
$("btn-stop").onclick = () => act("stop");
$("btn-restart").onclick = () => act("restart");

// ---------------- 顶栏「更多」菜单 ----------------
const moreBtn = $("btn-more");
const moreMenu = $("moremenu");
function closeMenu() {
  moreMenu.hidden = true;
  moreBtn.setAttribute("aria-expanded", "false");
}
moreBtn.onclick = (e) => {
  e.stopPropagation();
  const open = moreMenu.hidden;
  moreMenu.hidden = !open;
  moreBtn.setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", (e) => {
  if (!moreMenu.hidden && !moreMenu.contains(e.target) && e.target !== moreBtn) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeMenu();
});
moreMenu.querySelectorAll("button").forEach((b) => b.addEventListener("click", closeMenu));
$("level").addEventListener("change", closeMenu);
$("btn-clear").onclick = openClear;
$("btn-mem").onclick = async () => {
  $("mempane").classList.add("open");
  if (S.active === "all") {
    $("membody").innerHTML = '<div class="summary">记忆是按会话存的。先在左侧选一个群或私聊，再看它的记忆。</div>';
    return;
  }
  $("membody").innerHTML = '<div class="empty" style="margin:30px auto">读取中…</div>';
  const m = await api("/api/memory?chat=" + encodeURIComponent(S.active));
  renderMemory(m);
};
$("btn-mem-close").onclick = () => $("mempane").classList.remove("open");
$("btn-about").onclick = openAbout;
$("btn-stats").onclick = openStats;
$("btn-design").onclick = () => openDesign("persona");
$("jump").onclick = () => { toBottom(); };
$("level").onchange = (e) => {
  const v = e.target.value;
  $("hint").textContent = "正在切换频度…";
  act("level", { level: v }).then(() => setTimeout(refresh, 600));
};
$("q").oninput = (e) => { S.q = e.target.value; applyFilter(); };

async function sendNow() {
  const box = $("sendbox");
  const text = box.value.trim();
  if (!text) return;
  if (S.active === "all") {
    $("hint").textContent = "先在左侧选一个会话再发";
    return;
  }
  box.value = "";
  $("hint").textContent = "发送中…";
  const r = await act("send", { text: text });
  $("hint").textContent = r && r.ok ? "已发出" : ("发送失败" + (r && r.error ? "：" + r.error : ""));
  setTimeout(() => loadMessages(false), 1200);
}

$("btn-send").onclick = sendNow;
$("sendbox").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); sendNow(); }
});

function renderMemory(m) {
  m = m || {};
  const facts = (m.facts || []).map((f) => (typeof f === "string" ? { text: f, at: 0, pinned: false } : f));
  const events = (m.events || []).map((e) => (typeof e === "string" ? { text: e, at: 0 } : e));
  const mood = typeof m.mood === "number" ? m.mood : 60;
  const ageOf = (at) => {
    if (!at) return "";
    const days = Math.floor((Date.now() - at) / 86400000);
    return days <= 0 ? "今天" : days === 1 ? "昨天" : days + " 天前";
  };

  $("membody").innerHTML =
    "<h4>群近况</h4><div class=\"summary\">" + (m.summary ? esc(m.summary) : "（还没总结过）") + "</div>" +
    "<h4>最近发生的事（" + events.length + " 条）</h4>" +
    (events.length
      ? "<ul class=\"factlist\">" + events.map((e, i) =>
          "<li><span>" + esc(e.text) + "</span><span class=\"factmeta\">" + ageOf(e.at) + "</span></li>").join("") + "</ul>"
      : "<div class=\"summary\">暂无</div>") +
    "<h4>记得的事（" + facts.length + " 条）</h4>" +
    (facts.length
      ? "<ul class=\"factlist\">" + facts
          .map((f, i) => {
            const days = f.at ? Math.floor((Date.now() - f.at) / 86400000) : null;
            const age = days === null ? "" : days <= 0 ? "今天" : days + " 天前";
            return "<li>" +
              "<span>" + (f.pinned ? "📌 " : "") + esc(f.text) + "</span>" +
              "<span class=\"factmeta\">" + age + "</span>" +
              "<button data-pin=\"" + i + "\" data-on=\"" + (f.pinned ? "1" : "0") + "\">" + (f.pinned ? "取消置顶" : "置顶") + "</button>" +
              "<button data-del=\"" + i + "\">删除</button>" +
              "</li>";
          })
          .join("") + "</ul>"
      : "<div class=\"summary\">暂无</div>") +
    "<p class=\"hintline\">置顶的不会被遗忘；平时只按和当前话题的相关度挑几条放进 prompt，不是全塞。</p>" +
    "<h4>心情 " + mood + "/100</h4>" +
    "<input type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"" + mood + "\" id=\"moodRange\" style=\"width:100%\">" +
    "<div class=\"moodbar\"><span style=\"width:" + mood + "%\"></span></div>" +
    "<h4>消息累计</h4><div class=\"summary\">" + (m.count || 0) + " 条</div>" +
    "<h4>操作</h4><div style=\"display:flex;gap:8px;flex-wrap:wrap\">" +
    "<button id=\"memClearFacts\">清空事实</button>" +
    "<button id=\"memClearSummary\">清空摘要</button>" +
    "<button id=\"memPrompt\">看这次发给模型的</button>" +
    "<button id=\"memReset\" class=\"danger\">重置记忆（摘要+事实）</button>" +
    "</div>" +
    "<p class=\"hintline\">重置记忆不会清掉最近上下文；要连这段对话一起忘，用顶栏「清理」并勾上「最近上下文」。</p>";

  $("membody").querySelectorAll("[data-del]").forEach((b) => {
    b.onclick = async () => {
      await memoryAction("forgetFact", { index: Number(b.dataset.del) });
      setTimeout(refreshMemoryPanel, 900);
    };
  });

  $("membody").querySelectorAll("[data-pin]").forEach((b) => {
    b.onclick = async () => {
      await memoryAction("pinFact", { index: Number(b.dataset.pin), pinned: b.dataset.on !== "1" });
      setTimeout(refreshMemoryPanel, 900);
    };
  });

  const range = $("moodRange");
  if (range) {
    range.onchange = async () => {
      await memoryAction("setMood", { value: Number(range.value) });
      setTimeout(refreshMemoryPanel, 900);
    };
  }

  const cf = $("memClearFacts");
  if (cf) cf.onclick = async () => { await memoryAction("clearFacts"); setTimeout(refreshMemoryPanel, 900); };

  const cs = $("memClearSummary");
  if (cs) cs.onclick = async () => { await memoryAction("clearSummary"); setTimeout(refreshMemoryPanel, 900); };

  const mp = $("memPrompt");
  if (mp) mp.onclick = openPromptView;

  const rs = $("memReset");
  if (rs) rs.onclick = async () => {
    if (!confirm("确定把这个会话的记忆全部清掉吗？")) return;
    await memoryAction("resetGroup");
    setTimeout(refreshMemoryPanel, 900);
  };
}
let failStreak = 0;
async function tick() {
  const ok = await refresh();
  failStreak = ok ? 0 : failStreak + 1;
  $("banner").classList.toggle("on", failStreak >= 3);
  await loadMessages(false);
  setTimeout(tick, 1000);
}



// ---------------- 全局错误上报（会写进 data/app.log，方便排查） ----------------
function reportError(msg) {
  try { fetch("/api/diag?jserr=" + encodeURIComponent(String(msg || "").slice(0, 200))).catch(() => {}); } catch {}
}
window.addEventListener("error", (e) => {
  reportError((e.message || "error") + " @" + (e.filename || "").split("/").pop() + ":" + (e.lineno || 0));
});
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  reportError("promise: " + (r && r.message ? r.message : String(r)));
});
// ---------------- 多级窗口 ----------------
const modalStack = [];
function openModal(opts) {
  const mask = document.createElement("div");
  mask.className = "mask";
  const dlg = document.createElement("div");
  dlg.className = "dialog";
  if (opts.width) dlg.style.width = opts.width;

  dlg.innerHTML =
    '<header><b>' + esc(opts.title || "") + '</b><button class="x" data-close>关闭</button></header>' +
    '<div class="body">' + (opts.bodyHtml || "") + "</div>" +
    (opts.footHtml ? '<div class="foot">' + opts.footHtml + "</div>" : "");

  mask.appendChild(dlg);
  $("modals").appendChild(mask);

  const handle = {
    el: mask,
    dlg: dlg,
    body: dlg.querySelector(".body"),
    foot: dlg.querySelector(".foot"),
    close() {
      const i = modalStack.indexOf(handle);
      if (i >= 0) modalStack.splice(i, 1);
      mask.remove();
    },
  };

  dlg.querySelector("[data-close]").onclick = () => handle.close();
  mask.addEventListener("click", (e) => {
    if (e.target === mask) handle.close();
  });

  modalStack.push(handle);
  return handle;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalStack.length) modalStack[modalStack.length - 1].close();
});

// ---------------- 关于 ----------------

    openGuide();
  };
  top.foot.querySelector("#aboutSetup").onclick = () => {
    top.close();
    openSetup(1);
  };
}

// ---------------- 首次设置向导 ----------------
function setupBadge(ok, text) {
  return '<span style="color:' + (ok ? "var(--accent)" : "#c0392b") + '">' + (ok ? "✔ " : "✘ ") + esc(text) + "</span>";
}

async function maybeSetup() {
  try {
    const s = await api("/api/setup");
    if (s) S.setup = s;
    if (s && s.personaName) S.personaName = s.personaName;
    renderEmpty(true);
    if (s && (s.firstRun || s.node === false)) openSetup();
  } catch {}
}

/** 机器人名字从配置读，不要再写死某个角色名 */
async function loadPersonaName() {
  try {
    const p = await api("/api/persona");
    if (p && typeof p.name === "string" && p.name) S.personaName = p.name;
  } catch {}
  const box = $("sendbox");

async function openSetup(startStep) {
  let setup = {};
  let personaText = "";
  try { setup = (await api("/api/setup")) || {}; } catch {}
  try { const p = await api("/api/persona"); personaText = (p && p.text) || ""; } catch {}

  const S = { step: Number(startStep) || 1, setup: setup, persona: personaText, name: (setup && setup.personaName) || "" };
  const h = openModal({
    title: "首次设置向导",
    width: "580px",
    bodyHtml: '<div id="setupBody"></div>',
    footHtml: '<button id="suPrev">上一步</button><button id="suNext" class="primary">下一步</button>',
  });
  const body = h.body.querySelector("#setupBody");
  const prev = h.foot.querySelector("#suPrev");
  const next = h.foot.querySelector("#suNext");
  const stepLabel = (n) => "第 " + n + " / 4 步　";

  function render() {
    const s = S.setup || {};
    if (S.step === 1) {
      body.innerHTML =
        "<h4>" + stepLabel(1) + "检查环境</h4>" +
        '<div class="kv">' +
        "<div>Node.js</div><div>" + setupBadge(!!s.node, s.node ? s.nodeVersion : "未安装，去 nodejs.org 装 22 以上") + "</div>" +
        "<div>WebView2</div><div>" + setupBadge(!!s.webview, s.webview ? "已安装" : "缺失，装 Edge WebView2 运行时") + "</div>" +
        "<div>NapCat</div><div>" + setupBadge(!!s.napcat, s.napcat ? s.napcatDir : "没找到，可稍后在 app.json 里填 napcatDir") + "</div>" +
        "</div>" +
        '<p class="hintline">NapCat 负责把 QQ 变成接口，装在哪都行，程序会自动找常见目录；缺 Node.js 的话后面启动不了机器人。</p>' +
        '<button id="suRecheck">重新检测</button>';
      body.querySelector("#suRecheck").onclick = async () => {
        const fresh = await api("/api/setup");
        if (fresh) S.setup = fresh;
        render();
      };
      prev.disabled = true;
      next.textContent = "下一步";
    } else if (S.step === 2) {
      body.innerHTML =
        "<h4>" + stepLabel(2) + "大模型</h4>" +
        '<div class="field"><label>接口地址</label><input id="suBase" value="' + esc(s.baseUrl || "https://api.deepseek.com") + '"></div>' +
        '<div class="field"><label>模型</label><input id="suModel" value="' + esc(s.model || "deepseek-chat") + '"></div>' +
        '<div class="field"><label>API Key</label><input id="suKey" type="password" placeholder="sk-..." autocomplete="off"></div>' +
        '<p class="hintline">默认接 DeepSeek；任何 OpenAI 兼容接口都能用。Key 只写进本机的 config.json，不会上传。</p>' +
        (s.hasKey ? '<p class="hintline">已经填过 Key 了，留空表示不改。</p>' : "");
      prev.disabled = false;
      next.textContent = "保存并继续";
    } else if (S.step === 3) {
      body.innerHTML =
        "<h4>" + stepLabel(3) + "人格</h4>" +
        '<div class="field"><label>机器人叫什么（别人叫这个名字它就会接话）</label>' +
        '<input id="suName" type="text" maxlength="20" placeholder="例如：小满" value="' + esc(S.name || "") + '"></div>' +
        '<div class="field"><label>人设（Markdown，机器人每次回答都会读它）</label>' +
        '<textarea id="suPersona" rows="10" style="width:100%;box-sizing:border-box;resize:vertical">' + esc(S.persona) + "</textarea></div>" +
        '<p class="hintline">名字改完要重启机器人（先「停止」再「启动」）才会生效；人设保存后自动热重载。</p>';
      prev.disabled = false;
      next.textContent = "保存并继续";
    } else {
      body.innerHTML =
        "<h4>" + stepLabel(4) + "可以开始了</h4>" +
        '<ul class="hintline" style="padding-left:18px;line-height:1.9">' +
        "<li>点工具栏的「启动」拉起机器人（先让 NapCat 登录）</li>" +
        "<li>第一次登录会显示二维码，用手机 QQ 扫</li>" +
        "<li>聊天记录和记忆都存在本机 data 目录，不会上传</li>" +
        "<li>以后想再跑一遍：关于 → 设置向导</li>" +
        "</ul>" +
        '<button id="suGuide">看新手指引</button>';
      prev.disabled = false;
      next.textContent = "完成";
      const guideBtn = body.querySelector("#suGuide");
      if (guideBtn) guideBtn.onclick = () => { h.close(); openGuide(); };
    }
  }

  async function saveStep() {
    if (S.step === 2) {
      const key = (body.querySelector("#suKey").value || "").trim();
      const baseUrl = (body.querySelector("#suBase").value || "").trim();
      const model = (body.querySelector("#suModel").value || "").trim();
      if (!key && !(S.setup && S.setup.hasKey)) {
        body.querySelector("#suKey").focus();
        body.insertAdjacentHTML("beforeend", '<p class="hintline" style="color:#c0392b">先填一个 API Key 再继续</p>');
        return false;
      }
      const payload = { provider: "openai", baseUrl: baseUrl, model: model };
      if (key) payload.apiKey = key;
      const r = await api("/api/config", { method: "POST", body: JSON.stringify(payload) });
      if (!r || !r.ok) {
        body.insertAdjacentHTML("beforeend", '<p class="hintline" style="color:#c0392b">保存失败：' + esc((r && r.error) || "未知错误") + "</p>");
        return false;
      }
      S.setup = Object.assign({}, S.setup, { hasKey: true, baseUrl: baseUrl, model: model });
    }
    if (S.step === 3) {
      const text = body.querySelector("#suPersona").value;
      const name = (body.querySelector("#suName").value || "").trim();
      const payload = { text: text };
      if (name) payload.name = name;
      const r = await api("/api/persona", { method: "POST", body: JSON.stringify(payload) });
      if (!r || !r.ok) {
        body.insertAdjacentHTML("beforeend", '<p class="hintline" style="color:#c0392b">保存失败：' + esc((r && r.error) || "未知错误") + "</p>");
        return false;
      }
      if (name) {
        S.name = name;
        S.personaName = name;
        S.setup = Object.assign({}, S.setup, { personaName: name });
        const box = $("sendbox");
        if (box) box.placeholder = "以" + name + "的身份发一句（Enter 发送）";
      }
    }
    return true;
  }

  prev.onclick = () => {
    if (S.step > 1) {
      S.step -= 1;
      render();
    }
  };
  next.onclick = async () => {
    if (S.step === 4) {
      h.close();
      return;
    }
    if (!(await saveStep())) return;
    S.step += 1;
    render();
  };
  render();
}

      '<div class="field"><label>范围</label><select id="clScope">' +
      '<option value="chat"' + (isAll ? " disabled" : "") + ">当前会话" + (isAll ? "（先在左侧选一个）" : "（" + esc(chat) + "）") + "</option>" +
      '<option value="all">全部会话</option>' +
      "</select></div>" +
      '<div class="field"><label>清掉什么（可多选，互不影响）</label></div>' +

      '<label class="chk"><input type="checkbox" id="clMemory"> 长期记忆 <span class="muted">摘要 ' + (mem.summary ? 1 : 0) + ' 条 / 事实 ' + facts.length + ' 条 / 心情值</span></label>' +
      (st.bot ? "" : '<p class="hintline" style="color:#b45309">机器人没在运行：长期记忆仍可以直接清（写入 data/memory.json）；「最近上下文」本来就在它内存里，没运行等于已经没了。</p>') +
      '<p class="hintline">只清屏不会改变它怎么说话；清上下文只影响这段对话；清记忆才会删掉摘要与事实卡，且不能撤销。</p>',
    footHtml: '<button id="clCancel">取消</button><button id="clGo" class="danger">清理</button>',
  });

  const $b = (id) => h.body.querySelector("#" + id);
  h.foot.querySelector("#clCancel").onclick = () => h.close();

  h.foot.querySelector("#clGo").onclick = async () => {
    const scope = $b("clScope").value;
    const display = $b("clDisplay").checked;
    const context = $b("clContext").checked;
    const memory = $b("clMemory").checked;
    if (!display && !context && !memory) {
      $("hint").textContent = "至少勾一项再清理";
      return;
    }
    if (memory || context) {
      const what = [memory ? "长期记忆" : "", context ? "最近上下文" : ""].filter(Boolean).join("和");
      if (!confirm("确定要清掉" + what + "吗？这一步不能撤销。")) return;
    }

    const r = await api("/api/clear", {
      method: "POST",
      body: JSON.stringify({ scope: scope, chat: chat, display: display, context: context, memory: memory }),
    });
    if (!r || !r.ok) {
      $("hint").textContent = (r && r.error) || "清理失败";
      return;
    }

    h.close();
    list.innerHTML = "";
    S.seq = 0;
    updateEmpty();
    applyFilter();
    $("hint").textContent = "已清理";
    await refresh();
    await loadMessages(true);
    if (memory || context) setTimeout(refreshMemoryPanel, 800);
  };
}

async function openStats() {
  const h = openModal({ title: "命中率统计（最近 24 小时）", bodyHtml: '<div class="hintline">读取中…</div>' });
  const data = await api("/api/stats?hours=24");
  const hours = (data && data.hours) || [];
  const totalRecv = hours.reduce((a, b) => a + b.received, 0);
  const totalRepl = hours.reduce((a, b) => a + b.replied, 0);
  const rate = totalRecv ? Math.round((totalRepl / totalRecv) * 100) : 0;

  h.body.innerHTML =
    '<div class="kv" style="margin-bottom:14px">' +
    "<div>收到</div><div>" + totalRecv + " 条</div>" +
    "<div>回复</div><div>" + totalRepl + " 条</div>" +
    "<div>命中率</div><div><b style=\"color:var(--accent)\">" + rate + "%</b>（回复 / 收到）</div>" +
    "</div>" +
    '<svg class="chart" viewBox="0 0 680 200" preserveAspectRatio="none">' + chartSvg(hours) + "</svg>" +
    '<div class="hintline" style="margin-top:6px">浅绿＝收到，深绿＝回复，横轴为整点</div>';
}

function chartSvg(hours) {
  const W = 680, H = 200, padL = 30, padR = 8, padT = 12, padB = 24;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const max = Math.max(1, ...hours.map((x) => x.received));
  const n = hours.length || 1;
  const slot = innerW / n;
  const barW = Math.max(2, slot * 0.34);

  let g = "";
  // 横向参考线
  for (let i = 0; i <= 4; i += 1) {
    const y = padT + (innerH * i) / 4;
    const val = Math.round(max - (max * i) / 4);
    g += '<line class="axis" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"/>';
    g += '<text x="2" y="' + (y + 3) + '">' + val + "</text>";
  }

  hours.forEach((h, i) => {
    const x = padL + i * slot;
    const hr = (h.received / max) * innerH;
    const hp = (h.replied / max) * innerH;
    if (h.received) {
      g += '<rect class="bar-recv" x="' + (x + slot * 0.16) + '" y="' + (padT + innerH - hr) + '" width="' + barW + '" height="' + hr + '" rx="2"/>';
    }
    if (h.replied) {
      g += '<rect class="bar-repl" x="' + (x + slot * 0.16 + barW + 1) + '" y="' + (padT + innerH - hp) + '" width="' + barW + '" height="' + hp + '" rx="2"/>';
    }
    if (i % 4 === 0) {
      g += '<text x="' + (x + slot * 0.16) + '" y="' + (H - 6) + '">' + h.label + "</text>";
    }
  });

  return g;
}

function applyTheme(name, custom) {
  const styleEl = $("themeVars");
  const theme = THEMES[name];
  const vars = custom || (theme && theme.vars) || THEMES.light.vars;
  styleEl.textContent =
    ":root{" + Object.entries(vars).map(([k, v]) => k + ":" + v).join(";") + "}" +
    (theme && theme.extra ? theme.extra : "");
  localStorage.setItem("qqbot-theme", JSON.stringify({ name: name, custom: custom || null }));
}

function loadTheme() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem("qqbot-theme") || "null");
  } catch {}
  if (saved && saved.custom) applyTheme("custom", saved.custom);
  else applyTheme((saved && saved.name) || "light");
}

    "<h4>示例对话（可选，最多 3 组）</h4>" +
    '<div id="dExamples">' + examples.map(exRow).join("") + "</div>" +
    '<button id="dAddEx" style="margin-top:4px">再加一组</button>' +

    "<h4>API</h4>" +
    '<div class="kv">' +
    '<div>提供商</div><div><input id="cProvider" value="' + esc(cfg.provider || "") + '"></div>' +
    '<div>Base URL</div><div><input id="cBase" value="' + esc(cfg.baseUrl || "") + '"></div>' +
    '<div>模型</div><div><input id="cModel" value="' + esc(cfg.model || "") + '"></div>' +
    '<div>API Key</div><div><input id="cKey" type="password" placeholder="' + (cfg.hasKey ? "已配置，留空不改" : "还没配置") + '"></div>' +
    "</div>" +

    '<div style="margin-top:14px;display:flex;gap:8px;align-items:center">' +
    '<button class="primary" id="designSave">保存</button>' +
    '<span class="hintline" id="designMsg"></span></div>' +

    '<details style="margin-top:16px"><summary>高级：人设全文（persona.md，可选）</summary>' +
    '<div class="field"><textarea id="personaText" spellcheck="false"></textarea></div>' +
    '<div style="display:flex;gap:8px;align-items:center"><button id="personaSave">保存全文</button>' +
    '<button id="personaReset">恢复默认模板</button>' +
    '<span class="hintline" id="personaMsg"></span></div></details>';

  el.querySelector("#personaText").value = (p && p.text) || "";

  el.querySelectorAll("#dEmoji button").forEach((b) => {
    b.onclick = () => {
      el.querySelectorAll("#dEmoji button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
    };
  });

  el.querySelector("#dAddEx").onclick = () => {
    const box = el.querySelector("#dExamples");
    if (box.children.length >= 3) {
      el.querySelector("#designMsg").textContent = "最多 3 组";
      return;
    }
    box.insertAdjacentHTML("beforeend", exRow({ u: "", b: "" }, box.children.length));
  };

  el.querySelector("#designSave").onclick = async () => {
    const msg = el.querySelector("#designMsg");
    msg.textContent = "保存中…";

    const emojiBtn = el.querySelector("#dEmoji button.on");
    const catches = el.querySelector("#dCatch").value.split(/[,，、]/).map((s) => s.trim()).filter(Boolean).slice(0, 5);
    const tabooList = [...el.querySelectorAll("#dTaboo input:checked")].map((x) => x.value);
    const exs = [...el.querySelectorAll("#dExamples .exrow")].map((row) => ({
      u: row.querySelector("[data-ex-u]").value.trim(),
      b: row.querySelector("[data-ex-b]").value.trim(),
    })).filter((e) => e.u || e.b);

    const payload = {
      name: el.querySelector("#dName").value.trim(),
      tagline: el.querySelector("#dTag").value.trim(),
      style: {
        length: el.querySelector("#dLen").value,
        tone: el.querySelector("#dTone").value,
        emoji: emojiBtn ? Number(emojiBtn.dataset.v) : 1,
        catchphrases: catches,
        taboo: tabooList,
      },
      examples: exs,
    };

    const r = await api("/api/design", { method: "POST", body: JSON.stringify(payload) });
    if (!r || !r.ok) {
      msg.textContent = "保存失败：" + ((r && r.error) || "未知错误");
      return;
    }

    const cfgBody = {
      provider: el.querySelector("#cProvider").value.trim(),
      baseUrl: el.querySelector("#cBase").value.trim(),
      model: el.querySelector("#cModel").value.trim(),
    };
    const key = el.querySelector("#cKey").value.trim();
    if (key) cfgBody.apiKey = key;
    const rc = await api("/api/config", { method: "POST", body: JSON.stringify(cfgBody) });

    if (payload.name) {
      S.personaName = payload.name;
      const box = $("sendbox");
      if (box) box.placeholder = "以" + payload.name + "的身份发一句（Enter 发送）";
    }
    msg.textContent = rc && rc.ok ? "已保存，下一句回复生效" : "人设已保存；API 配置保存失败";
  };

  el.querySelector("#personaSave").onclick = async () => {
    const t = el.querySelector("#personaText").value;
    const r = await api("/api/persona", { method: "POST", body: JSON.stringify({ text: t }) });
    el.querySelector("#personaMsg").textContent = r && r.ok ? "已保存" : "保存失败";
  };

  el.querySelector("#personaReset").onclick = () => {
    el.querySelector("#personaText").value =
      "# 你的名字\n\n你是群里的一员，说话简短、自然、像真人。\n\n## 性格\n\n- \n\n## 说话习惯\n\n- 每次只说一两句\n- 不用书面语\n\n## 示例\n\n群友：在吗\n你：在\n";
  };

  // 底部固定的保存按钮，转去点表单里的同一个处理函数
  const footSave = $("designFootSave");
  if (footSave) footSave.onclick = () => el.querySelector("#designSave").click();
}

function paintTheme(el) {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem("qqbot-theme") || "null");
  } catch {}
  const current = (saved && saved.name) || "light";
  const custom = saved && saved.custom;

  el.innerHTML =
    '<div class="hintline" style="margin-bottom:8px">选一个配色，立即生效</div>' +
    '<div class="swatches">' +
    Object.entries(THEMES)
      .map(
        ([k, t]) =>
          '<div class="swatch ' + (k === current && !custom ? "on" : "") + '" data-theme="' + k + '" ' +
          'style="background:' + t.vars["--bg"] + ";color:" + t.vars["--text"] + '">' + t.label + "</div>"
      )
      .join("") +
    "</div>" +
    '<h4 style="margin:18px 0 8px;font-size:12px;color:var(--muted)">自定义</h4>' +
    '<div class="kv" id="customVars"></div>' +
    '<div style="margin-top:12px"><button id="themeApply">应用自定义配色</button> ' +
    '<button id="themeReset">恢复默认</button></div>';

  const vars = custom || THEMES[current].vars;
  const labels = {
    "--bg": "背景",
    "--panel": "面板",
    "--panel-2": "次级面板",
    "--line": "分隔线",
    "--text": "文字",
    "--muted": "次要文字",
    "--accent": "强调色",
  };
  const box = el.querySelector("#customVars");
  box.innerHTML = Object.keys(labels)
    .map(
      (k) =>
        "<div>" + labels[k] + '</div><div><input type="color" data-var="' + k + '" value="' + (vars[k] || "#ffffff") + '"></div>'
    )
    .join("");

  el.querySelectorAll("[data-theme]").forEach((sw) => {
    sw.onclick = () => {
      applyTheme(sw.dataset.theme);
      paintTheme(el);
    };
  });

  el.querySelector("#themeApply").onclick = () => {
    const out = {};
    el.querySelectorAll("[data-var]").forEach((i) => {
      out[i.dataset.var] = i.value;
    });
    applyTheme("custom", out);
    paintTheme(el);
  };

  el.querySelector("#themeReset").onclick = () => {
    localStorage.removeItem("qqbot-theme");
    applyTheme("light");
    paintTheme(el);
  };
}

// ---------------- 记忆编辑 ----------------
function memoryAction(cmd, extra) {
  if (S.active === "all") {
    $("hint").textContent = "先在左侧选一个会话，再编辑它的记忆";
    return Promise.resolve(null);
  }
  return api("/api/control", {
    method: "POST",
    body: JSON.stringify(Object.assign({ cmd: cmd, chat: S.active }, extra || {})),
  });
}

async function refreshMemoryPanel() {
  const m = await api("/api/memory?chat=" + encodeURIComponent(S.active));
  renderMemory(m);
}


loadTheme();
loadPersonaName();
refresh().then(() => loadMessages(true)).then(() => { tick(); maybeSetup(); });
</script>
